    .check { grid-template-columns: 36px minmax(0, 1fr); }
    .check .state { grid-column: 2; }
  }
</style>

    kv('Checksum', h('span', null, m.checksum + ' ', h('span', { class: 'sub', style: 'font-family: var(--font-body)', text: '(sample)' })));
    kv('IPFS CID', h('span', null, r.cid, copyBtn('CID', r.cid)));
    kv('Gateway URL', h('span', null, gw, copyBtn('gateway URL', gw)));
    kv('Pin status', h('span', { class: 'chip chip-green' }, h('span', { class: 'pip', 'aria-hidden': 'true' }), h('span', { text: m.pin })), true);
    kv('Retention', m.retention, true);
    panel.appendChild(h('div', { class: 'panel' }, dl));

    panel.appendChild(note('info', 'info', 'IPFS content is addressed by its CID. Anyone who has the CID can fetch the file from a public gateway, so share the CID only with people who should see the recording.'));

    var delBtn = h('button', { class: 'btn btn-danger', type: 'button', onclick: function () {
      KM.confirm({
        title: 'Delete this recording?',
        body: h('div', { class: 'stack-sm' },
          h('p', { text: 'This deletes “' + r.title + '” from ' + (byo ? 'your bucket ' + r.bucket : 'KnowMe-managed storage') + ', removes the transcript and summary from KnowMe, and unpins the CID.' }),
          h('p', { text: 'Unpinning stops ' + (byo ? 'your pinning service' : 'KnowMe') + ' from hosting the file, but copies other IPFS nodes already fetched may persist and stay reachable by CID. Links already sent to participants will stop working.' })),
        confirmLabel: 'Delete recording', danger: true
      }).then(function (ok) {
        if (!ok) return;
        var restore = busy(delBtn, 'Deleting…');
        setTimeout(function () {
          restore();
          markDeleted(r.id);
          if (P.id === r.id) { stopPlayer(); P.id = null; }
          KM.toast('Recording deleted and unpinned', 'trash');
          location.hash = '#library';
        }, 1100);
      });
    } }, icon('trash'), h('span', { text: 'Delete recording' }));
    panel.appendChild(h('section', { class: 'panel', 'aria-labelledby': 'dz-h' },
      h('h3', { id: 'dz-h', text: 'Delete recording' }),
      h('p', { class: 'small sub', text: 'Removes the file from storage, the transcript and summary from KnowMe, and unpins it from IPFS. This can’t be undone.' }),
      h('div', null, delBtn)));
  }

  /* ------------------------------------------------------------ #processing:<id> */
  function renderProcessing(arg) {
    var r = getRec(arg);
    if (!r) { notFound(arg); return; }
    var byo = r.storage === 'byo';
    var user = KM.auth.get();
    var run = ++processingRun;
    setTitle('Processing — ' + r.title);
    KM.clear(main);
    var steps = [
      ['Finalize composite', 'LiveKit Egress closes the Room Composite ' + r.format.toUpperCase(), 1600],
      ['Upload to S3', byo ? 'Writing to your bucket ' + r.bucket : 'Writing to KnowMe-managed S3-compatible storage', 2000],
      ['Pin to IPFS', byo ? 'Pinning through your pinning service' : 'Pinning through KnowMe pinning', 1600],
      ['Summary', 'Generating the summary and action items from the transcript', 1800],
      ['Delivery', 'Sending transcript and summary per your delivery settings', 1300]
    ];
    var overall = h('span', { style: 'width:0%' });
    var overallLbl = h('span', { class: 'small sub', text: 'Starting…' });
    var list = h('ol', { class: 'checks' });
    var rows = steps.map(function (s, i) {
      var st = h('span', { class: 'st', 'aria-hidden': 'true' }, h('span', { class: 'mono', text: String(i + 1) }));
      var state = h('span', { class: 'state', text: 'Waiting' });
      var bar = h('span');
      var li = h('li', { class: 'check', 'data-s': 'wait' }, st,
        h('span', { class: 'lbl' }, h('b', { text: s[0] }), h('small', { text: s[1] })), state,
        h('span', { class: 'bar', 'aria-hidden': 'true' }, bar));
      list.appendChild(li);
      return { li: li, st: st, state: state, bar: bar };
    });
    var done = h('div', { hidden: true });
    var notifyIn = h('input', { type: 'checkbox', checked: true, id: 'notify-me', onchange: function () {
      KM.toast(this.checked ? 'We’ll email you when it’s ready' : 'Notification turned off', this.checked ? 'mail' : 'x');
    } });

    main.appendChild(crumbs([['Recordings', '#library'], [r.title, '#detail:' + r.id], ['Processing']]));
    main.appendChild(h('div', { class: 'page-head' },
      h('div', null,
        h('span', { class: 'eyebrow', text: 'Still finalizing' }),
        h('h1', { text: r.title }),
        h('p', { class: 'sub', text: 'The meeting has ended. Your recording is being finalized, stored and pinned. You can leave this page — we’ll notify you when it’s ready.' }))));
    main.appendChild(h('div', { class: 'grid-2', style: 'align-items:start' },
      h('section', { class: 'stack', 'aria-labelledby': 'pp-h' },
        h('h2', { id: 'pp-h', class: 'sr-only', text: 'Pipeline progress' }),
        h('div', { class: 'stack-sm' },
          h('div', { class: 'meter', role: 'progressbar', 'aria-label': 'Overall progress', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': '0', id: 'pp-meter' }, overall),
          overallLbl),
        list, done),
      h('aside', { class: 'panel', 'aria-labelledby': 'nt-h' },
        h('h2', { id: 'nt-h', style: 'font-size: var(--text-lg)', text: 'We’ll notify you' }),
        h('label', { class: 'switch-row', for: 'notify-me' },
          h('span', { class: 'copy' }, h('b', { text: 'Email me when it’s ready' }), h('span', { class: 'small sub od-truncate', title: user ? user.email : '', text: user ? user.email : '' })),
          h('span', { class: 'switch' }, notifyIn, h('span', { class: 'track' }), h('span', { class: 'thumb' }))),
        h('dl', { class: 'kv' },
          h('dt', { text: 'Duration' }), h('dd', { class: 'plain', text: fmt.mins(r.durationMin) }),
          h('dt', { text: 'Layout' }), h('dd', { class: 'plain', text: (r.layout === 'grid' ? 'Grid' : 'Speaker') + ' · ' + r.format.toUpperCase() }),
          h('dt', { text: 'Destination' }), h('dd', { text: r.bucket })),
        h('a', { class: 'btn btn-ghost btn-sm', href: '#library' }, icon('film', 'ic-sm'), h('span', { text: 'Back to recordings' })))));

    var total = steps.reduce(function (s, x) { return s + x[2]; }, 0), elapsed = 0;
    var meter = document.getElementById('pp-meter');
    function stepRun(i) {
      if (run !== processingRun) return;
      if (i >= steps.length) {
        overallLbl.textContent = 'All steps complete';
        done.hidden = false;
        KM.clear(done);
        done.appendChild(h('div', { class: 'note note-ok', role: 'status' }, icon('check'),
          h('div', { class: 'stack-sm' },
            h('b', { text: 'Recording ready' }),
            h('span', { text: 'Stored, pinned to IPFS, and the summary has ' + (r.summarySent ? 'been sent to participants.' : 'been held for your review.') }),
            h('div', { class: 'btn-row' },
              h('a', { class: 'btn btn-primary btn-sm', href: '#detail:' + r.id }, icon('play', 'ic-sm'), h('span', { text: 'Open recording' })),
              h('a', { class: 'btn btn-sm', href: '#detail:' + r.id + ':storage' }, h('span', { text: 'View storage details' }))))));
        KM.toast('Recording ready: ' + r.title, 'check');
        return;
      }
      var row = rows[i];
      row.li.setAttribute('data-s', 'run');
      KM.clear(row.st); row.st.appendChild(icon('refresh', 'spin'));
      row.state.textContent = 'In progress';
      overallLbl.textContent = 'Step ' + (i + 1) + ' of ' + steps.length + ': ' + steps[i][0];
      var dur = steps[i][2], t0 = Date.now();
      var iv = setInterval(function () {
        if (run !== processingRun) { clearInterval(iv); return; }
        var f = Math.min(1, (Date.now() - t0) / dur);
        row.bar.style.transform = 'scaleX(' + f + ')';
        var pct = Math.round((elapsed + f * dur) / total * 100);
        overall.style.width = pct + '%';
        meter.setAttribute('aria-valuenow', String(pct));
        if (f >= 1) {
          clearInterval(iv);
          elapsed += dur;
          row.li.setAttribute('data-s', 'ok');
          KM.clear(row.st); row.st.appendChild(icon('check'));
          row.state.textContent = i === 2 ? 'Pinned' : (i === 4 && !r.summarySent ? 'Held for review' : 'Done');
          stepRun(i + 1);
        }
      }, 100);
    }
    setTimeout(function () { stepRun(0); }, 400);
  }

  /* ------------------------------------------------------------ router */
  var router = KM.route({
    library: gated(renderLibrary),
    detail: gated(renderDetail),
    processing: gated(renderProcessing),
    empty: gated(renderEmpty)
  }, 'library');
  KM.auth.onChange(function () { router.refresh(); });
})();
</script>
</body>
</html>
