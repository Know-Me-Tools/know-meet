<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t">
  <title id="t">Know Meet background: Ground</title>
  <!-- Brand tokens only (dark theme values): bg #0B0F14, bg-2 #111620, surface #181F2B,
       card #222B3B, muted #2A3548, ember #FF6A3D, ember-soft #2B1A18, cyan #00C2DC.
       Filled shapes only: no strokes, no text, no photography. -->
  <defs>
    <radialGradient id="lift" cx="560" cy="300" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#181F2B"/>
      <stop offset="0.55" stop-color="#111620"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </radialGradient>
    <radialGradient id="core" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#FF6A3D" stop-opacity="0.34"/>
      <stop offset="0.7" stop-color="#2B1A18" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2B1A18"/>
    </radialGradient>
    <radialGradient id="halo" cx="1040" cy="340" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B1A18" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2B1A18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.62" stop-color="#0B0F14" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B0F14" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#lift)"/>
  <rect width="1280" height="720" fill="url(#halo)"/>
  <!-- Gathering motif at the right third, scaled x10 from the 64-unit symbol. -->
  <g transform="translate(1040 340)">
    <circle r="110" fill="url(#core)"/>
    <circle cx="0" cy="-210" r="60" fill="#222B3B"/>
    <circle cx="199.7" cy="-64.9" r="60" fill="#00C2DC" fill-opacity="0.26"/>
    <circle cx="123.4" cy="169.9" r="60" fill="#222B3B"/>
    <circle cx="-123.4" cy="169.9" r="60" fill="#2A3548" fill-opacity="0.8"/>
    <circle cx="-199.7" cy="-64.9" r="60" fill="#222B3B"/>
  </g>
  <rect width="1280" height="720" fill="url(#floor)"/>
</svg>
