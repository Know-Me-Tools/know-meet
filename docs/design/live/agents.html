<style>
  /* ---- page-local: agents.html (uses shared tokens only) */
  .req { color: var(--ember-text); }
  .h3 { font-size: var(--text-lg); }
  .form-note { font-size: var(--text-sm); color: var(--fg-sub); }

  .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s4); align-items: end; margin-bottom: var(--s5); }
  .search-wrap { position: relative; }
  .search-wrap .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--fg-sub); pointer-events: none; }
  .search-wrap .input { padding-left: 44px; }
  .result-count { font-size: var(--text-sm); color: var(--fg-sub); min-height: 1.5em; }

  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--s2) var(--s4); }
  .sec-head > div { display: grid; gap: 2px; min-width: 0; }
  .sec-head p { color: var(--fg-sub); font-size: var(--text-sm); }
  .row-meta { display: flex; flex-wrap: wrap; gap: 2px var(--s3); color: var(--fg-sub); font-size: var(--text-sm); }
  .row-meta > span { min-width: 0; overflow-wrap: anywhere; }
  .row-meta .mono { color: var(--fg); }
  .row-chev { color: var(--fg-sub); }
  .pip-hollow { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px var(--fg-sub); }

  /* wizard */
  .wiz-steps { margin: 0 0 var(--s6); }
  .wiz-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--s6); align-items: start; }
  .wiz-form { display: grid; gap: var(--s5); align-content: start; }
  .wiz-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--s3); margin-top: var(--s6); padding-top: var(--s5); box-shadow: inset 0 1px 0 var(--muted); }
  .wiz-foot .btn-row { margin-left: auto; }
  .preview { position: sticky; top: calc(var(--header-h) + var(--s5)); }
  .preview-tile { display: grid; justify-items: center; gap: var(--s3); padding: var(--s6) var(--s4); border-radius: var(--radius-tile); background: var(--bg); text-align: center; }
  .preview-tile .agent-glyph { width: 84px; }
  .preview-tile > * { max-width: 100%; }

  .fs { border: 0; padding: 0; margin: 0; display: grid; gap: var(--s2); min-width: 0; }
  .fs-legend { padding: 0; margin-bottom: var(--s1); font-weight: 600; font-size: var(--text-sm); }
  .options { display: grid; gap: var(--s2); }
  .options-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .option { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s3); align-items: start; padding: var(--s3) var(--s4); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-card); cursor: pointer; transition: background-color var(--dur-fast) ease, box-shadow var(--dur-fast) ease; }
  .card .option, .panel .option { background: var(--card); }
  .option input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ember-btn); }
  .option:has(input:checked) { box-shadow: inset 0 0 0 2px var(--ember); }
  .option:has(input:focus-visible) { background: var(--focus); color: var(--on-focus); }
  .option:has(input:focus-visible) * { color: inherit; }
  .option input:focus-visible { background: var(--on-focus); color: var(--focus); }
  @media (hover: hover) { .option:hover { background: var(--card-hov); } }
  .option-copy { display: grid; gap: 2px; min-width: 0; }
  .option-title { font-weight: 600; font-size: var(--text-sm); }
  .option-desc { color: var(--fg-sub); font-size: var(--text-sm); }

  .reveal { display: grid; gap: var(--s4); padding: var(--s4); border-radius: var(--radius-tile); background: var(--surface); }
  .notice { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s3); align-items: start; padding: var(--s3) var(--s4); border-radius: var(--radius); background: var(--cyan-soft); color: var(--fg); font-size: var(--text-sm); }
  .notice .ic { color: var(--cyan-text); margin-top: 1px; }
  .notice-warn { background: var(--amber-soft); }
  .notice-warn .ic { color: var(--amber-text); }
  .notice-danger { background: var(--red-soft); }
  .notice-danger .ic { color: var(--red-text); }
  .notice > div { display: grid; gap: var(--s1); min-width: 0; }
  .code-wrap { display: grid; gap: var(--s2); }
  .code-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }

  /* connection test */
  .checks { display: grid; gap: var(--s2); }
  .check { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); border-radius: var(--radius); background: var(--card); }
  .check-ic { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--muted); color: var(--fg-sub); font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
  .check-ic .ic { width: 16px; height: 16px; stroke-width: 2.25; }
  .check-body { display: grid; gap: 2px; min-width: 0; }
  .check-body > * { display: block; }
  .check-title { font-weight: 600; font-size: var(--text-sm); }
  .check-detail { color: var(--fg-sub); font-size: var(--text-sm); overflow-wrap: anywhere; }
  .check-status { font-size: var(--text-sm); font-weight: 600; color: var(--fg-sub); white-space: nowrap; }
  .check[data-state="running"] .check-ic { background: var(--amber-soft); color: var(--amber-text); }
  .check[data-state="running"] .check-ic .ic { animation: spin 1s linear infinite; }
  .check[data-state="running"] .check-status { color: var(--amber-text); }
  .check[data-state="passed"] .check-ic { background: var(--green-soft); color: var(--green-text); }
  .check[data-state="passed"] .check-status { color: var(--green-text); }
  .check[data-state="failed"] .check-ic { background: var(--red-soft); color: var(--red-text); }
  .check[data-state="failed"] .check-status { color: var(--red-text); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success-panel { display: grid; gap: var(--s3); padding: var(--s5); border-radius: var(--radius-tile); background: var(--green-soft); }
  .success-panel h2 { display: flex; align-items: center; gap: var(--s2); }
  .success-panel h2 .ic { color: var(--green-text); }

  .summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
  .summary-grid .card { gap: var(--s2); }
  .summary-grid .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .summary-grid .kv dd + dt { margin-top: var(--s2); }

  /* detail */
  .detail-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s5); align-items: center; margin-bottom: var(--s5); }
  .detail-head .agent-glyph { width: 72px; }
  .detail-head .titles { display: grid; gap: var(--s2); min-width: 0; }
  .detail-head .titles > * { min-width: 0; }
  .meta-line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4); color: var(--fg-sub); font-size: var(--text-sm); }
  .worker-pill { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
  .worker-pill code { overflow-wrap: anywhere; }
  .worker-pill .icon-btn { width: 36px; height: 36px; }
  .tab-panel { padding-top: var(--s5); }
  .danger-panel { box-shadow: inset 0 0 0 1px var(--red-soft); }
  .danger-panel h2 { display: flex; align-items: center; gap: var(--s2); }
  .danger-panel h2 .ic { color: var(--red-text); }
  .dirty-note { font-size: var(--text-sm); color: var(--fg-sub); }

  /* concierge */
  .hero-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s5); align-items: center; }
  .hero-row .agent-glyph { width: 84px; }
  .feature-ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--ember-soft); color: var(--ember-text); }
  .feature-ic.cyan { background: var(--cyan-soft); color: var(--cyan-text); }
  .plain-list { display: grid; gap: var(--s2); margin: 0; padding: 0; list-style: none; }
  .plain-list li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s2); align-items: start; font-size: var(--text-sm); }
  .plain-list li .ic { width: 18px; height: 18px; margin-top: 1px; }
  .plain-list .yes .ic { color: var(--green-text); }
  .plain-list .no .ic { color: var(--red-text); }
  .cta-panel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s5); align-items: center; }

  /* dots */
  .dot-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s4); align-items: start; }
  .dot-card .orb { width: 64px; }
  .dot-card .body { display: grid; gap: var(--s2); min-width: 0; }
  .dot-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s5); align-items: center; margin-bottom: var(--s5); }
  .dot-head .orb { width: 72px; }
  .dot-head .titles { display: grid; gap: var(--s2); min-width: 0; }
  .memory-text { color: var(--fg); font-size: var(--text-sm); overflow-wrap: anywhere; }
  .two-col { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--s5); align-items: start; }

  .gate-extra { font-size: var(--text-sm); }

  @media (max-width: 1023px) {
    .wiz-grid { grid-template-columns: minmax(0, 1fr); }
    .preview { position: static; }
    .summary-grid { grid-template-columns: minmax(0, 1fr); }
    .two-col { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 767px) {
    .toolbar { grid-template-columns: minmax(0, 1fr); }
    .options-3 { grid-template-columns: minmax(0, 1fr); }
    .detail-head { grid-template-columns: auto minmax(0, 1fr); gap: var(--s4); }
    .detail-head .agent-glyph { width: 56px; }
    .detail-head .head-actions { grid-column: 1 / -1; }
    .hero-row { grid-template-columns: minmax(0, 1fr); }
    .cta-panel { grid-template-columns: minmax(0, 1fr); }
    .check { grid-template-columns: auto minmax(0, 1fr); }
    .check-status { grid-column: 2; }
    .wiz-foot .btn-row { margin-left: 0; width: 100%; }
    .wiz-foot .btn-row .btn { flex: 1 1 auto; }
    .dot-head .orb { width: 56px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .check[data-state="running"] .check-ic .ic { animation: none; }
  }
</style>

<script>
(function () {
  'use strict';

  var h = KM.h;
  var icon = KM.icon;
  var D = KM.data;
  var main = document.getElementById('main');

  KM.mountAppBar(document.getElementById('appbar'), { active: 'agents' });

  /* ------------------------------------------------------------ constants */
  var STATE_KEY = 'km-agents-state-v1';
  var DRAFT_KEY = 'km-agent-draft-v1';
  var SLUG_RE = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
  var GLYPH_RE = /^[A-Za-z0-9]{2}$/;
  var STEP_MS = 900;
  var SAVE_MS = 700;
  var FAIL_WORKER = 'missing-worker';
  var STEPS = ['Identity', 'Worker & dispatch', 'Permissions & knowledge', 'Test & finish'];

  var MEDIA = {
    speak: { label: 'Speak and listen', desc: 'Hears the room and can talk. Can also post to meeting chat.' },
    listen: { label: 'Listen only', desc: 'Hears the room and reads granted knowledge. Never speaks or posts.' },
    chat: { label: 'Chat only', desc: 'Hears the room and replies in meeting chat, never out loud.' }
  };
  var KNOWLEDGE = {
    shared: { label: 'Shared meeting knowledge', desc: 'Includes the live transcript and anything participants add to the meeting’s knowledge.' },
    files: { label: 'Shared knowledge plus host-only files', desc: 'Also reads files the host has kept private to their own agents.' },
    none: { label: 'None', desc: 'Gets no transcript or files from KnowMe. Works only from what it hears.' }
  };
  var DISPATCH = {
    me: { label: 'Only me', desc: 'Only you can bring it into meetings you host.' },
    anyone: { label: 'Anyone in meetings I host', desc: 'Any participant in a meeting you host can dispatch it.' }
  };
  var AUTOJOIN = {
    never: { label: 'Never — on request', desc: 'Joins only when someone dispatches it.' },
    mine: { label: 'My meetings', desc: 'Joins every meeting you host as soon as it starts.' },
    tagged: { label: 'Meetings tagged…', desc: 'Joins meetings you host that carry a tag you choose.' }
  };

  /* Per-agent configuration for the sample registry (fictional). */
  var CONFIG = {
    concierge: { project: 'managed', media: 'speak', knowledge: 'shared', dispatch: 'system', autoJoin: 'always' },
    scribe: { project: 'managed', media: 'listen', knowledge: 'shared', dispatch: 'anyone', autoJoin: 'mine' },
    researcher: { project: 'managed', media: 'speak', knowledge: 'files', dispatch: 'me', autoJoin: 'never' },
    facilitator: { project: 'managed', media: 'speak', knowledge: 'shared', dispatch: 'anyone', autoJoin: 'tagged', tag: 'workshop' },
    translator: { project: 'own', url: 'wss://lumenlabs-voice.livekit.cloud', media: 'speak', knowledge: 'shared', dispatch: 'me', autoJoin: 'never' }
  };

  var live = D.meeting('partner-onboarding');
  var ACTIVITY = {
    concierge: [
      { meeting: 'Partner onboarding review', date: live.start, min: null, outcome: 'live' },
      { meeting: 'Partner onboarding review', date: '2026-10-14T16:00:00', min: 46, outcome: 'done' },
      { meeting: 'Design critique', date: '2026-10-09T11:00:00', min: 31, outcome: 'done' },
      { meeting: 'Vendor security call', date: '2026-10-02T15:30:00', min: 52, outcome: 'done' }
    ],
    scribe: [
      { meeting: 'Partner onboarding review', date: live.start, min: null, outcome: 'live' },
      { meeting: 'Partner onboarding review', date: '2026-10-14T16:00:00', min: 46, outcome: 'done' },
      { meeting: 'Design critique', date: '2026-10-09T11:00:00', min: 31, outcome: 'done' }
    ],
    researcher: [
      { meeting: 'Partner onboarding review', date: live.start, min: null, outcome: 'live' },
      { meeting: 'Partner onboarding review', date: '2026-10-14T16:00:00', min: 38, outcome: 'done' },
      { meeting: 'Vendor security call', date: '2026-10-02T15:30:00', min: 52, outcome: 'done' }
    ],
    facilitator: [
      { meeting: 'Weekly product sync', date: '2026-10-12T10:00:00', min: 28, outcome: 'done' },
      { meeting: 'Weekly product sync', date: '2026-10-05T10:00:00', min: 30, outcome: 'done' }
    ],
    translator: [
      { meeting: 'Weekly product sync', date: '2026-10-12T10:00:00', min: 0, outcome: 'failed' },
      { meeting: 'Design critique', date: '2026-10-09T11:00:00', min: 24, outcome: 'done' }
    ]
  };
  var OUTCOME = {
    live: { label: 'In meeting now', cls: 'chip chip-cyan' },
    done: { label: 'Completed', cls: 'chip chip-green' },
    failed: { label: 'Worker offline — not joined', cls: 'chip chip-red' }
  };

  var MEMORIES = [
    { id: 'm-1014', meeting: 'Partner onboarding review', date: '2026-10-14T16:46:00', text: 'Marcus owns the partner API checklist; you offered to review it before Friday.' },
    { id: 'm-1012', meeting: 'Weekly product sync', date: '2026-10-12T10:30:00', text: 'Pricing review moved to later this week; Avery will bring two options.' },
    { id: 'm-1009', meeting: 'Design critique', date: '2026-10-09T11:31:00', text: 'You preferred the grid layout for recordings; Dana is sharing revised mocks.' },
    { id: 'm-1002', meeting: 'Vendor security call', date: '2026-10-02T16:22:00', text: 'You asked to revisit data-retention terms before signing anything.' }
  ];
  var VOICES = [
    { value: 'warm', label: 'Warm (default)' },
    { value: 'calm', label: 'Calm' },
    { value: 'bright', label: 'Bright' },
    { value: 'low', label: 'Low' }
  ];

  /* ------------------------------------------------------------ storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (_) { return null; }
  }
  function writeJSON(key, val) {
    try {
      if (val == null) window.localStorage.removeItem(key);
      else window.localStorage.setItem(key, JSON.stringify(val));
    } catch (_) { /* storage unavailable — state stays in memory for this visit */ }
  }
  function str(v, max) { return typeof v === 'string' ? v.slice(0, max || 200) : ''; }
  function pick(v, allowed, fallback) { return Object.prototype.hasOwnProperty.call(allowed, v) ? v : fallback; }

  function sanitizeAdded(a) {
    if (!a || typeof a !== 'object' || !SLUG_RE.test(str(a.worker, 48))) return null;
    return {
      id: a.worker, worker: a.worker, name: str(a.name, 40) || a.worker, role: str(a.role, 40), desc: str(a.desc, 200),
      mono: GLYPH_RE.test(str(a.mono, 2)) ? a.mono.toUpperCase() : 'AG', system: false, status: 'online',
      owner: str(a.owner, 80) || 'You', project: a.project === 'own' ? 'own' : 'managed', url: str(a.url, 200),
      media: pick(a.media, MEDIA, 'speak'), knowledge: pick(a.knowledge, KNOWLEDGE, 'shared'),
      dispatch: pick(a.dispatch, DISPATCH, 'me'), autoJoin: pick(a.autoJoin, AUTOJOIN, 'never'), tag: str(a.tag, 32),
      added: true
    };
  }
  function loadState() {
    var s = readJSON(STATE_KEY) || {};
    var added = Array.isArray(s.added) ? s.added.map(sanitizeAdded).filter(Boolean) : [];
    var removed = Array.isArray(s.removed) ? s.removed.filter(function (x) { return typeof x === 'string'; }) : [];
    var overrides = s.overrides && typeof s.overrides === 'object' ? s.overrides : {};
    var iris = s.iris && typeof s.iris === 'object' ? s.iris : {};
    return {
      added: added,
      removed: removed,
      overrides: overrides,
      iris: {
        name: str(iris.name, 24) || 'Iris',
        voice: pick(iris.voice, { warm: 1, calm: 1, bright: 1, low: 1 }, 'warm'),
        join: iris.join === 'ask' ? 'ask' : 'always',
        speak: iris.speak === 'never' ? 'never' : 'asked',
        scope: {
          summaries: iris.scope ? iris.scope.summaries !== false : true,
          conversations: iris.scope ? iris.scope.conversations !== false : true,
          files: iris.scope ? iris.scope.files === true : false
        },
        paused: iris.paused === true,
        byDefault: iris.byDefault !== false,
        forgotten: Array.isArray(iris.forgotten) ? iris.forgotten.filter(function (x) { return typeof x === 'string'; }) : []
      }
    };
  }
  var state = loadState();
  function setState(patch) {
    state = Object.assign({}, state, patch);
    writeJSON(STATE_KEY, state);
  }
  function setIris(patch) { setState({ iris: Object.assign({}, state.iris, patch) }); }

  /* Draft: non-secret fields persist; key/secret live in memory only. */
  var EMPTY_DRAFT = { name: '', desc: '', role: '', glyph: '', project: 'managed', url: '', agentName: '', media: 'speak', knowledge: 'shared', dispatch: 'me', autoJoin: 'never', tag: '' };
  function loadDraft() {
    var d = readJSON(DRAFT_KEY) || {};
    return {
      name: str(d.name, 40), desc: str(d.desc, 200), role: str(d.role, 40), glyph: str(d.glyph, 2),
      project: d.project === 'own' ? 'own' : 'managed', url: str(d.url, 200), agentName: str(d.agentName, 48),
      media: pick(d.media, MEDIA, 'speak'), knowledge: pick(d.knowledge, KNOWLEDGE, 'shared'),
      dispatch: pick(d.dispatch, DISPATCH, 'me'), autoJoin: pick(d.autoJoin, AUTOJOIN, 'never'), tag: str(d.tag, 32)
    };
  }
  var draft = loadDraft();
  var secrets = { apiKey: '', apiSecret: '' };
  var lastRegistered = null;
  var lastFailure = null;
  function setDraft(k, v) {
    var next = Object.assign({}, draft);
    next[k] = v;
    draft = next;

          icon('trash', 'ic-sm'), h('span', { text: 'Forget' }));
        forget.addEventListener('click', function () {
          KM.confirm({ title: 'Forget this memory?', body: h('div', { class: 'stack-sm' },
              h('p', { text: '“' + m.text + '”' }),
              h('p', { text: state.iris.name + ' will permanently forget this. It can’t be restored.' })),
            confirmLabel: 'Forget', danger: true }).then(function (ok) {
            if (!ok) return;
            setIris({ forgotten: state.iris.forgotten.concat([m.id]) });
            paintMemories();
            KM.toast('Memory forgotten', 'trash');
            var first = memList.querySelector('button');
            if (first) first.focus();
          });
        });
        memList.appendChild(h('div', { class: 'list-row' },
          h('span', { class: 'lead', 'aria-hidden': 'true' }, icon('book')),
          h('div', { class: 'body' },
            h('span', { class: 'title od-truncate', title: m.meeting, text: m.meeting }),
            h('span', { class: 'meta', text: KM.fmt.date(m.date) }),
            h('p', { class: 'memory-text', text: m.text })),
          h('div', { class: 'trail' }, forget)));
      });
    }
    var memSection = h('section', { class: 'panel', 'aria-labelledby': 'iris-mem' },
      h('div', { class: 'sec-head' }, h('div', null, h('h2', { id: 'iris-mem', text: 'Recent meeting memories' }), memCount)),
      memList);

    paintStatus();
    paintMemories();
    render(iris.name, head,
      h('div', { class: 'panel', style: 'margin-bottom: var(--s5)' }, pause.row),
      h('div', { class: 'two-col' }, settingsForm, memSection));
  }

  /* ============================================================ router */
  var router = KM.route({
    registry: function (arg, params) { renderRegistry(params); },
    register: function (arg, params) { renderWizard(arg, params); },
    'register-error': function () { renderRegisterError(); },
    detail: function (arg, params) { renderDetail(arg, params); },
    concierge: function () { renderConcierge(); },
    dots: function () { renderDots(); },
    dot: function (arg) { renderDot(arg); }
  }, 'registry');

  KM.auth.onChange(function () { router.refresh(); });
})();
</script>
</body>
</html>
