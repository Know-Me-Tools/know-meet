<link rel="stylesheet" href="assets/km.css">
<style>
  /* ---- dashboard-local layout (uses shared tokens only) */
  .dash-tabs { margin: calc(var(--s2) * -1) 0 var(--s5); }
  .dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--s5); align-items: start; }
  .dash-side { display: grid; gap: var(--s4); align-content: start; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: var(--s5); align-items: start; }
  .split-aside { position: sticky; top: calc(var(--header-h) + var(--s4)); display: grid; gap: var(--s4); }
  @media (max-width: 1023px) {
    .dash-grid, .split { grid-template-columns: minmax(0, 1fr); }
    .split-aside { position: static; }
  }

  /* live banner */
  .live-banner {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s4); align-items: center;
    padding: var(--s4) var(--s5); border-radius: var(--radius-tile);
    background: var(--ember-soft); color: var(--fg); margin-bottom: var(--s5);
  }
  .live-banner h2 { font-size: var(--text-lg); }
  .live-pip { position: relative; width: 12px; height: 12px; border-radius: 50%; background: var(--ember); }
  .live-pip::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--ember); animation: live-ring 1.8s var(--ease-out) infinite; }
  @keyframes live-ring { from { transform: scale(1); opacity: 0.6; } to { transform: scale(2.6); opacity: 0; } }
  @media (max-width: 767px) {
    .live-banner { grid-template-columns: auto minmax(0, 1fr); }
    .live-banner .btn-row { grid-column: 1 / -1; }
  }

  /* toolbar */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); }
  .toolbar .search { position: relative; flex: 1 1 220px; max-width: 360px; }
  .toolbar .search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--fg-sub); pointer-events: none; }
  .toolbar .search .input { padding-left: 42px; min-height: 44px; }
  .toolbar select.input { min-height: 44px; width: auto; }

  /* meetings list */
  .day-group { display: grid; gap: var(--s2); }
  .day-group + .day-group { margin-top: var(--s5); }
  .day-label { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-sub); }
  .mt-row {
    display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: var(--s4); align-items: center;
    padding: var(--s4); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-card);
  }
  .mt-time { display: grid; gap: 2px; }
  .mt-time strong { font-family: var(--font-display); font-weight: 600; font-size: var(--text-base); }
  .mt-body { display: grid; gap: var(--s2); min-width: 0; }
  .mt-title { color: var(--fg); font-weight: 600; text-decoration: none; }
  .mt-title:hover { text-decoration: underline; }
  .meta-item { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--fg-sub); white-space: nowrap; }
  .meta-item .ic { width: 16px; height: 16px; }
  .mt-actions { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 767px) {
    .mt-row { grid-template-columns: minmax(0, 1fr); gap: var(--s3); }
    .mt-time { display: flex; align-items: baseline; gap: var(--s2); }
    .mt-actions { justify-content: flex-start; }
  }
  .count-sub { font-size: var(--text-sm); color: var(--fg-sub); margin-left: var(--s2); white-space: nowrap; }

  /* side cards */
  .cal-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s2) 0; }
  .cal-row + .cal-row { padding-top: var(--s3); }
  .cal-row .lead { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--muted); }
  .cal-row .body { display: grid; gap: 2px; min-width: 0; }
  .cal-row .body > * { display: block; }
  .sync-status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--fg-sub); }
  .sync-status .ic { width: 16px; height: 16px; }
  .sync-status.ok .ic { color: var(--green-text); }
  .tally { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
  .tally > div { display: grid; gap: 2px; padding: var(--s3); border-radius: var(--radius); background: var(--card); }
  .tally > div > * { display: block; }
  .tally strong { font-family: var(--font-display); font-size: var(--text-xl); font-variant-numeric: tabular-nums; }

  /* spinner */
  .spin { animation: dash-spin 0.9s linear infinite; }
  @keyframes dash-spin { to { transform: rotate(360deg); } }

  /* forms */
  .req { color: var(--ember-text); margin-left: 2px; }
  .form-stack { display: grid; gap: var(--s4); }
  .panel h2 { font-size: var(--text-lg); }
  .field-row-3 { display: grid; gap: var(--s4); grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 767px) { .field-row-3 { grid-template-columns: minmax(0, 1fr); } }
  .sw-label { font-weight: 600; font-size: var(--text-sm); cursor: pointer; }
  .note { display: flex; gap: var(--s2); align-items: flex-start; padding: var(--s3); border-radius: var(--radius); background: var(--card); font-size: var(--text-sm); color: var(--fg-sub); }
  .note .ic { width: 18px; height: 18px; color: var(--cyan-text); margin-top: 1px; }
  .dial-preview { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); padding: var(--s2) var(--s3); border-radius: var(--radius); background: var(--card); font-family: var(--font-mono); font-size: 13px; margin-top: var(--s2); }
  .err-summary { display: grid; gap: var(--s2); padding: var(--s4) var(--s5); border-radius: var(--radius-tile); background: var(--red-soft); } /* tinted fill + icon + text; no stripe (RV-29) */
  .err-summary h2 { font-size: var(--text-lg); display: flex; align-items: center; gap: var(--s2); }
  .err-summary h2 .ic { color: var(--red-text); }
  .err-summary ul { margin: 0; padding-left: var(--s5); }
  .err-summary a { color: var(--fg); font-weight: 500; }

  /* invitee chips */
  .inv-list { display: grid; gap: var(--s2); }
  .inv-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: 6px 6px 6px var(--s3); border-radius: var(--radius); background: var(--card); }
  .inv-item .ic-wrap { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--muted); }
  .inv-item .body { display: grid; gap: 2px; min-width: 0; }
  .inv-item .body > * { display: block; }
  .chan-label { font-size: var(--text-xs); color: var(--fg-sub); }
  .chan-label b { color: var(--fg); font-weight: 600; }

  /* agent picks */
  .pick { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: var(--s3); align-items: center; padding: var(--s2) var(--s3); border-radius: var(--radius); background: var(--card); cursor: pointer; min-height: 56px; }
  .pick input { width: 20px; height: 20px; margin: 0; accent-color: var(--ember-btn); }
  .pick .body { display: grid; gap: 2px; min-width: 0; }
  .pick .body > * { display: block; }
  .pick-grid { display: grid; gap: var(--s2); grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 599px) { .pick-grid { grid-template-columns: minmax(0, 1fr); } }

  /* files */
  .file-drop { display: grid; gap: var(--s2); justify-items: start; padding: var(--s4); border-radius: var(--radius); background: var(--card); }
  .file-list { display: grid; gap: var(--s2); }
  .file-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: 4px 4px 4px var(--s3); border-radius: var(--radius); background: var(--card); }
  .file-item .body { display: grid; gap: 0; min-width: 0; }
  .file-item .body > * { display: block; }

  /* previews */
  .pv { display: grid; gap: var(--s3); }
  .pv-mail { display: grid; gap: var(--s3); padding: var(--s4); border-radius: var(--radius); background: var(--card); font-size: var(--text-sm); }
  .pv-mail-head { display: grid; gap: 2px; padding-bottom: var(--s3); }
  .pv-mail-head > * { display: block; overflow-wrap: anywhere; }
  .pv-mail-head .subj { font-family: var(--font-display); font-weight: 600; font-size: var(--text-base); color: var(--fg); }
  .pv-mail p { overflow-wrap: anywhere; }
  .pv-cta { display: inline-flex; align-items: center; gap: 6px; justify-self: start; padding: 8px 14px; border-radius: 10px; background: var(--ember-btn); color: var(--on-ember); font-weight: 600; }
  .pv-dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px var(--s3); margin: 0; }
  .pv-dl dt { color: var(--fg-sub); }
  .pv-dl dd { margin: 0; overflow-wrap: anywhere; }
  .pv-sms-wrap { display: grid; gap: var(--s2); padding: var(--s4); border-radius: var(--radius); background: var(--card); }
  .pv-sms { justify-self: start; max-width: 100%; padding: 10px 14px; border-radius: 18px 18px 18px 4px; background: var(--muted); font-size: var(--text-sm); white-space: pre-wrap; overflow-wrap: anywhere; }

  /* success + detail */
  .ok-badge { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: var(--green-soft); color: var(--green-text); }
  .deliv-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s3); align-items: start; padding: var(--s3) 0; }
  .deliv-row .body { display: grid; gap: var(--s2); min-width: 0; }
  .detail-head { display: grid; gap: var(--s3); margin-bottom: var(--s5); }
  .detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); color: var(--fg-sub); font-size: var(--text-sm); }
  .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }
  .detail-grid .wide { grid-column: 1 / -1; }
  @media (max-width: 899px) { .detail-grid { grid-template-columns: minmax(0, 1fr); } }
  .status-stack { display: grid; gap: 6px; }
  .status-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .reason { font-size: var(--text-xs); color: var(--fg-sub); max-width: 34ch; }
  .agent-line { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s2) 0; }
  .agent-line .body { display: grid; gap: 2px; min-width: 0; }
  .agent-line .body > * { display: block; }
  .banner-cancel { display: flex; gap: var(--s2); align-items: center; padding: var(--s3) var(--s4); border-radius: var(--radius); background: var(--red-soft); color: var(--fg); font-weight: 500; }
  .banner-cancel .ic { color: var(--red-text); }
  .table td .who { display: grid; gap: 2px; min-width: 160px; }
  .table td .who > * { display: block; }
  .table td.tight { width: 1%; }
  .table input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--ember-btn); margin: 0; }
  .row-actions { display: flex; flex-wrap: wrap; gap: var(--s2); justify-content: flex-end; }
  .steps-plain { display: grid; gap: var(--s3); margin: 0; padding: 0; list-style: none; counter-reset: s; text-align: left; }
  .steps-plain li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s3); align-items: start; counter-increment: s; font-size: var(--text-sm); color: var(--fg-sub); }
  .steps-plain li::before { content: counter(s); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--muted); color: var(--fg); font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
  .steps-plain b { color: var(--fg); }
  .empty-first { max-width: 640px; margin: 0 auto; padding: var(--s7) var(--s5); }
</style>

<a class="skip-link" href="#main" id="skip">Skip to content</a>
<div class="app">
  <header id="appbar"></header>
  <main id="main" class="page" tabindex="-1"></main>
</div>
<script src="assets/km.js"></script>
<script>
(function () {
  'use strict';
  var h = KM.h, icon = KM.icon, fmt = KM.fmt, D = KM.data;
  var main = document.getElementById('main');
  var MIN = 60000;
  var STORE_KEY = 'km-dash-state';
  var LANDLINE_REASON = 'Number cannot receive SMS (landline)';
  var MAX_FILE_BYTES = 50 * 1024 * 1024;
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var CAL_ACCOUNTS = {
    google: { label: 'Google Calendar', account: D.user.email },
    outlook: { label: 'Outlook', account: 'jordan.reyes@outlook.com' }
  };

  KM.mountAppBar(document.getElementById('appbar'), { active: 'meetings' });
  document.getElementById('skip').addEventListener('click', function (e) {
    e.preventDefault(); main.focus();
  });

  /* ---------------------------------------------------------------- time zones */
  var LOCAL_TZ = (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (_) { return 'UTC'; } })();
  var TZS = [
    ['America/Los_Angeles', 'Pacific Time — Los Angeles'], ['America/Denver', 'Mountain Time — Denver'],
    ['America/Chicago', 'Central Time — Chicago'], ['America/New_York', 'Eastern Time — New York'],
    ['Europe/London', 'London'], ['Europe/Berlin', 'Central Europe — Berlin'],
    ['Asia/Kolkata', 'India — Kolkata'], ['Asia/Tokyo', 'Tokyo'], ['UTC', 'UTC']
  ];
  if (!TZS.some(function (t) { return t[0] === LOCAL_TZ; })) TZS.unshift([LOCAL_TZ, LOCAL_TZ.replace(/_/g, ' ')]);
  function tzLabel(id) { var t = TZS.filter(function (x) { return x[0] === id; })[0]; return t ? t[1] : id; }

  /* ---------------------------------------------------------------- page state (session) */
  function loadState() {
    var empty = { created: [], createdDeliveries: [], cancelled: [], overrides: {}, patch: {}, preReads: {} };
    try {
      var raw = sessionStorage.getItem(STORE_KEY);
      if (!raw) return empty;
      var s = JSON.parse(raw);
      return {
        created: Array.isArray(s.created) ? s.created : [],
        createdDeliveries: Array.isArray(s.createdDeliveries) ? s.createdDeliveries : [],
        cancelled: Array.isArray(s.cancelled) ? s.cancelled : [],
        overrides: s.overrides && typeof s.overrides === 'object' ? s.overrides : {},
        patch: s.patch && typeof s.patch === 'object' ? s.patch : {},
        preReads: s.preReads && typeof s.preReads === 'object' ? s.preReads : {}
      };
    } catch (_) { return empty; }
  }
  var state = loadState();
  function save() { try { sessionStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (_) { /* storage unavailable */ } }
  function setState(key, value) { state = Object.assign({}, state, (function () { var o = {}; o[key] = value; return o; })()); save(); }

  /* ---------------------------------------------------------------- meetings */
  var BASE_EXTRA = {
    'partner-onboarding': { tz: LOCAL_TZ, dots: ['iris'], description: 'Walk Northwind and Lumen Labs through the partner program and agree on onboarding owners.',
      preReads: [{ name: 'Partner program overview.pdf', size: 1258291 }, { name: 'Onboarding checklist v3.docx', size: 84210 }] },
    'cohort-kickoff': { tz: LOCAL_TZ, dots: ['iris'], waitingRoom: true, description: 'Kick off Cohort 2: introductions, schedule and first deliverables.',
      preReads: [{ name: 'Cohort 2 roster.xlsx', size: 40960 }] },
    'product-sync': { tz: LOCAL_TZ, dots: ['sol', 'iris'], description: 'Weekly status across roadmap items.', preReads: [] },
    'pricing-review': { tz: LOCAL_TZ, dots: ['iris'], description: 'Review the pricing model draft before it goes to partners.',
      preReads: [{ name: 'Pricing model draft.pdf', size: 2306867 }, { name: 'Competitor notes.md', size: 12288 }] }
  };
  function baseMeeting(id) {
    if (D.meeting(id)) return D.meeting(id);
    return state.created.filter(function (m) { return m.id === id; })[0] || null;
  }
  function getMeeting(id) {
    var base = baseMeeting(id);
    if (!base) return null;
    return Object.assign(
      { transcribe: true, sendSummary: true, waitingRoom: false, dots: [], description: '', tz: LOCAL_TZ, preReads: [] },
      BASE_EXTRA[id] || {}, base, state.overrides[id] || {},
      { cancelled: state.cancelled.indexOf(id) > -1 });
  }
  function allMeetings() {
    return D.meetings.concat(state.created).map(function (m) { return getMeeting(m.id); })
      .sort(function (a, b) { return new Date(a.start) - new Date(b.start); });
  }
  function statusOf(m) { return m.cancelled ? 'cancelled' : D.meetingStatus(m); }
  function endOf(m) { return new Date(new Date(m.start).getTime() + m.durationMin * MIN); }
  function isHosting(m) { return m.host === D.user.name; }
  function joinUrl(m) {
    try { return new URL('join.html#invite?code=' + encodeURIComponent(m.joinCode), location.href).href; }
    catch (_) { return 'join.html#invite?code=' + encodeURIComponent(m.joinCode); }
  }
  function getPreReads(m) { return state.preReads[m.id] || m.preReads || []; }
  function newCode() {
    var a = 'abcdefghjkmnpqrstuvwxyz23456789';
    function part(n) { var s = ''; for (var i = 0; i < n; i++) s += a.charAt(Math.floor(Math.random() * a.length)); return s; }
    return 'km-' + part(3) + '-' + part(3);
  }

  /* ---------------------------------------------------------------- deliveries */
  function buildBaseDeliveries() {
    var list = [];
    D.meetings.forEach(function (m) {
      var sentAt = new Date(new Date(m.start).getTime() - 2 * 24 * 60 * MIN).toISOString();
      m.invitees.forEach(function (name, i) {
        var p = D.person(name) || { id: 'self', name: name, email: name === D.user.name ? D.user.email : '', phone: null };
        var phoneOnly = m.id === 'pricing-review' && p.id === 'dana';
        var chans = [];
        if (!phoneOnly && p.email) chans.push('email');
        if (p.phone && (i % 2 === 0 || phoneOnly)) chans.push('sms');
        if (m.source !== 'knowme' && p.email && !phoneOnly) chans.push('calendar');
        chans.forEach(function (ch) {
          var st = 'delivered', reason = null, landline = false;
          if (ch === 'email' && i === 0) st = 'opened';
          if (ch === 'sms' && m.id === 'cohort-kickoff') st = 'queued';
          if (ch === 'sms' && phoneOnly) { st = 'failed'; reason = LANDLINE_REASON; landline = true; }
          list.push({ id: m.id + '-' + p.id + '-' + ch, meetingId: m.id, name: p.name, personId: p.id, channel: ch,
            to: ch === 'sms' ? p.phone : p.email, status: st, reason: reason, landline: landline, sentAt: sentAt });
        });
      });
    });
    return list;
  }
  var BASE_DELIVERIES = buildBaseDeliveries();
  function deliveries() {
    return BASE_DELIVERIES.concat(state.createdDeliveries).map(function (d) { return Object.assign({}, d, state.patch[d.id] || {}); })
      .filter(function (d) { var m = getMeeting(d.meetingId); return m && !m.cancelled; });
  }
  function patchDelivery(id, p) {
    var next = Object.assign({}, state.patch);
    next[id] = Object.assign({}, next[id] || {}, p);
    setState('patch', next);
  }
  var RESEND_MS = 1100;
  function resend(d) {
    return new Promise(function (resolve) {
      setTimeout(function () {
        var p = d.landline
          ? { status: 'failed', reason: LANDLINE_REASON, resentAt: new Date().toISOString() }
          : { status: 'delivered', reason: null, resentAt: new Date().toISOString() };
        patchDelivery(d.id, p);
        resolve(Object.assign({}, d, p));
      }, RESEND_MS);
    });
  }
  function sendEmailInstead(d) {
    var p = D.person(d.name);
    var email = p && p.email;
    return new Promise(function (resolve, reject) {

  function isoDate(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function hhmm(d) { return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function phoneDigits(v) { return String(v).replace(/[\s().\-]/g, ''); }
  function knownPersonFor(value) {
    var v = String(value).toLowerCase();
    var pd = phoneDigits(value).replace(/^\+?1?/, '');
    return D.people.filter(function (p) {
      return p.email.toLowerCase() === v || (pd.length >= 10 && phoneDigits(p.phone).replace(/^\+?1?/, '') === pd);
    })[0] || null;
  }
  /* → {ok, error, invitee} */
  function parseInvitee(raw) {
    var v = String(raw || '').replace(/^\s+|\s+$/g, '');
    if (!v) return { ok: false, error: '' };
    var known = knownPersonFor(v);
    if (EMAIL_RE.test(v)) {
      return { ok: true, invitee: { key: v.toLowerCase(), value: v, kind: 'email', name: known ? known.name : v,
        email: v, phone: known ? known.phone : null } };
    }
    var digits = phoneDigits(v);
    if (/^\+?\d+$/.test(digits)) {
      var bare = digits.replace(/^\+/, '');
      if (bare.length === 10 && digits.charAt(0) !== '+') digits = '+1' + bare;
      else if (digits.charAt(0) !== '+') digits = '+' + bare;
      if (bare.length < 10 || bare.length > 15) {
        return { ok: false, error: '“' + v + '” doesn’t look like a full phone number. Include the country code, like +1 415 555 0142.' };
      }
      return { ok: true, invitee: { key: digits, value: v, kind: 'phone', name: known ? known.name : v,
        email: known ? known.email : null, phone: digits } };
    }
    if (v.indexOf('@') > -1) return { ok: false, error: '“' + v + '” isn’t a complete email address. Use the form name@company.com.' };
    return { ok: false, error: '“' + v + '” isn’t an email or phone number. Enter an address like name@company.com or a number with country code, like +1 415 555 0142.' };
  }
  function channelsFor(inv) {

  /* ================================================================ #invites */
  function renderInvites() {
    document.title = 'Invites · Know Meet';
    var f = { channel: 'all', status: 'all', q: '' };
    var selected = {};
    var tbodyHost = h('div');
    var countEl = h('span', { class: 'small sub', role: 'status' });
    var resendSelBtn = h('button', { class: 'btn btn-sm btn-primary', type: 'button', disabled: true }, icon('refresh', 'ic-sm'), h('span', { text: 'Resend selected (0)' }));
    var resendFailedBtn = h('button', { class: 'btn btn-sm', type: 'button' }, icon('alert', 'ic-sm'), h('span', { text: 'Resend failed' }));

    function rows() {
      var q = f.q.toLowerCase();
      return deliveries().filter(function (d) {
        var m = getMeeting(d.meetingId);
        if (f.channel !== 'all' && d.channel !== f.channel) return false;
        if (f.status !== 'all') {
          if (f.status === 'failed' && !(d.status === 'failed' && !d.resolvedByEmail)) return false;
          if (f.status !== 'failed' && d.status !== f.status) return false;
        }
        if (q && (d.name + ' ' + (d.to || '') + ' ' + m.title).toLowerCase().indexOf(q) < 0) return false;
        return true;
      }).sort(function (a, b) {
        var fa = a.status === 'failed' && !a.resolvedByEmail ? 0 : 1, fb = b.status === 'failed' && !b.resolvedByEmail ? 0 : 1;
        return fa - fb || new Date(getMeeting(a.meetingId).start) - new Date(getMeeting(b.meetingId).start);
      });
    }
    function selCount() { return Object.keys(selected).filter(function (k) { return selected[k]; }).length; }
    function syncBulk() {
      var n = selCount();
      resendSelBtn.disabled = !n;
      resendSelBtn.lastChild.textContent = 'Resend selected (' + n + ')';
      var failedN = deliveries().filter(function (d) { return d.status === 'failed' && !d.resolvedByEmail; }).length;
      resendFailedBtn.disabled = !failedN;
      resendFailedBtn.lastChild.textContent = 'Resend failed (' + failedN + ')';
    }
    function resendMany(list, btn) {
      if (!list.length) return;
      var restore = busy(btn, 'Resending ' + list.length + '…');
      Promise.all(list.map(resend)).then(function (res) {
        restore();
        var still = res.filter(function (r) { return r.status === 'failed'; }).length;
        var ok = res.length - still;
        KM.toast((ok ? 'Resent ' + ok + (ok === 1 ? ' invite' : ' invites') : 'Nothing resent') + (still ? '. ' + still + ' SMS still undeliverable — send email instead.' : ''), still ? 'alert' : 'check');
        selected = {};
        draw();
      });
    }
    resendSelBtn.addEventListener('click', function () {
      resendMany(deliveries().filter(function (d) { return selected[d.id]; }), resendSelBtn);
    });
    resendFailedBtn.addEventListener('click', function () {
      resendMany(deliveries().filter(function (d) { return d.status === 'failed' && !d.resolvedByEmail; }), resendFailedBtn);
    });

    function draw() {
      KM.clear(tbodyHost);
      var list = rows();
      countEl.textContent = list.length + (list.length === 1 ? ' invite' : ' invites');
      Object.keys(selected).forEach(function (k) { if (!list.some(function (d) { return d.id === k; })) delete selected[k]; });
      syncBulk();
      if (!list.length) {
        tbodyHost.appendChild(h('div', { class: 'empty' },
          h('div', { class: 'empty-icon' }, icon('filter')),
          h('h3', { text: 'No invites match these filters' }),
          h('p', { text: 'Try another channel or status, or clear the search.' }),
          h('button', { class: 'btn btn-sm', type: 'button', text: 'Clear filters', onclick: function () {
            f = { channel: 'all', status: 'all', q: '' };
            chanSeg.querySelectorAll('button').forEach(function (b, i) { b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false'); });
            statusSel.value = 'all'; search.value = '';
            draw();
          } })));
        return;
      }
      var allBox = h('input', { type: 'checkbox', 'aria-label': 'Select all ' + list.length + ' shown invites' });
      var allSel = list.every(function (d) { return selected[d.id]; });
      allBox.checked = allSel;
      allBox.indeterminate = !allSel && list.some(function (d) { return selected[d.id]; });
      allBox.addEventListener('change', function () {
        list.forEach(function (d) { selected[d.id] = allBox.checked; });
        draw();
      });
      var tbody = h('tbody');
      list.forEach(function (d) {
        var m = getMeeting(d.meetingId);
        var isFailed = d.status === 'failed' && !d.resolvedByEmail;
        var box = h('input', { type: 'checkbox', 'aria-label': 'Select invite to ' + d.name + ' by ' + CHANNEL[d.channel][1] + ' for ' + m.title });
        box.checked = !!selected[d.id];
        box.addEventListener('change', function () { selected[d.id] = box.checked; syncBulk(); allBox.checked = list.every(function (x) { return selected[x.id]; }); allBox.indeterminate = !allBox.checked && selCount() > 0; });
        var actions = h('div', { class: 'row-actions' });
        if (isFailed && d.landline) {
          var alt = h('button', { class: 'btn btn-sm btn-primary', type: 'button', 'aria-label': 'Send email instead to ' + d.name }, icon('mail', 'ic-sm'), h('span', { text: 'Send email instead' }));
          alt.addEventListener('click', function () {
            busy(alt, 'Sending…');
            sendEmailInstead(d).then(function (email) { KM.toast('Email invite sent to ' + email, 'check'); draw(); },
              function (err) { KM.toast(err.message, 'alert'); draw(); });
          });
          actions.appendChild(alt);
        }
        var rb = h('button', { class: 'btn btn-sm', type: 'button', 'aria-label': 'Resend ' + CHANNEL[d.channel][1] + ' invite to ' + d.name }, icon('refresh', 'ic-sm'), h('span', { text: 'Resend' }));
        rb.addEventListener('click', function () {
          busy(rb, 'Resending…');
          resend(d).then(function (r) {
            KM.toast(r.status === 'failed' ? 'SMS still undeliverable — this number is a landline. Send email instead.' : 'Invite resent to ' + d.name, r.status === 'failed' ? 'alert' : 'check');
            draw();
          });
        });
        actions.appendChild(rb);
        tbody.appendChild(h('tr', null,
          h('td', { class: 'tight' }, box),
          h('td', null, h('div', { class: 'who' }, h('strong', { text: d.name }), h('span', { class: 'xsmall sub', text: d.to || '' }))),
          h('td', null, h('a', { class: 'od-truncate', style: 'max-width:28ch', href: '#meeting:' + m.id, title: m.title, text: m.title }),
            h('span', { class: 'xsmall sub od-nowrap', text: fmt.date(m.start) })),
          h('td', null, channelChip(d.channel)),
          h('td', null,
            d.resolvedByEmail ? h('span', { class: 'chip' }, icon('mail'), h('span', { text: 'Failed · email sent instead' })) : statusChip(d.status),
            isFailed ? h('p', { class: 'reason', text: d.reason + '. Suggestion: send an email invite instead.' }) : null),
          h('td', null, h('span', { class: 'small od-nowrap', text: d.resentAt ? 'Resent ' + fmt.time(d.resentAt) : fmt.date(d.sentAt) })),
          h('td', { class: 'tight' }, actions)));
      });
      tbodyHost.appendChild(h('div', { class: 'table-wrap' }, h('table', { class: 'table' },
        h('caption', { class: 'sr-only', text: 'Sent invites with delivery status' }),
        h('thead', null, h('tr', null,
          h('th', { scope: 'col', class: 'tight' }, allBox),
          h('th', { scope: 'col', text: 'Invitee' }), h('th', { scope: 'col', text: 'Meeting' }), h('th', { scope: 'col', text: 'Channel' }),
          h('th', { scope: 'col', text: 'Status' }), h('th', { scope: 'col', text: 'Sent' }), h('th', { scope: 'col' }, h('span', { class: 'sr-only', text: 'Actions' })))),
        tbody)));
    }

    var CH = [['all', 'All'], ['email', 'Email'], ['sms', 'SMS'], ['calendar', 'Calendar']];
    var chanSeg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Filter by channel' }, CH.map(function (c) {
      return h('button', { type: 'button', 'aria-pressed': c[0] === 'all' ? 'true' : 'false', text: c[1], onclick: function (e) {
        f = Object.assign({}, f, { channel: c[0] });
        KM.$$('button', chanSeg).forEach(function (b) { b.setAttribute('aria-pressed', b === e.currentTarget ? 'true' : 'false'); });
        draw();
      } });
    }));
    var statusSel = h('select', { class: 'input', id: 'inv-status', onchange: function () { f = Object.assign({}, f, { status: statusSel.value }); draw(); } },
      [['all', 'Any status'], ['delivered', 'Delivered'], ['opened', 'Opened'], ['queued', 'Queued'], ['failed', 'Failed']].map(function (s) { return h('option', { value: s[0], text: s[1] }); }));
    var search = h('input', { class: 'input', type: 'search', id: 'inv-search', placeholder: 'Search name, email, phone or meeting', autocomplete: 'off',
      oninput: function () { f = Object.assign({}, f, { q: search.value.trim() }); draw(); } });

    render(
      pageHead({ title: 'Invites', sub: 'Every invite you’ve sent for upcoming meetings, with delivery status by email, SMS and calendar.',
        actions: [h('a', { class: 'btn btn-primary', href: '#schedule' }, icon('plus'), h('span', { text: 'Schedule meeting' }))] }),
      dashTabs('invites'),
      h('div', { class: 'toolbar' },
        chanSeg,
        h('div', { class: 'od-cluster' },
          h('label', { class: 'sr-only', for: 'inv-status', text: 'Status' }), statusSel,
          h('div', { class: 'search' }, icon('search', 'ic-sm'), h('label', { class: 'sr-only', for: 'inv-search', text: 'Search invites' }), search))),
      h('div', { class: 'toolbar' }, countEl, h('div', { class: 'btn-row' }, resendFailedBtn, resendSelBtn)),
      tbodyHost);
    draw();
  }

  /* ================================================================ router */
  function guard(key, fn) {
    return function (arg, params) {
      if (!KM.auth.isSignedIn()) { renderGate(key); return; }
      fn(arg, params || {});
    };
  }
  var router = KM.route({
    upcoming: guard('upcoming', renderUpcoming),
    schedule: guard('schedule', renderSchedule),
    meeting: guard('meeting', renderMeeting),
    invites: guard('invites', renderInvites),
    empty: guard('empty', renderEmpty)
  }, 'upcoming');
  KM.auth.onChange(function () { router.refresh(); });
})();
</script>
</body>
</html>
