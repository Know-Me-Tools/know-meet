<style>
  /* ---- page-local: settings ---- */
  .content { display: grid; gap: var(--s5); align-content: start; min-width: 0; }
  .content .page-head { margin-bottom: 0; }
  .sidenav > .eyebrow { padding: 0 var(--s3) var(--s2); }
  .req { color: var(--ember-text); }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { padding: 0; margin-bottom: 6px; font-weight: 600; font-size: var(--text-sm); }
  fieldset[disabled] { opacity: 0.55; }
  .panel > h2, .panel .panel-h { font-size: var(--text-lg); }
  .panel-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--s3); }
  .panel-head > div { display: grid; gap: 4px; min-width: 0; max-width: 64ch; }
  .panel-head p { color: var(--fg-sub); font-size: var(--text-sm); }
  .form-foot { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; padding-top: var(--s2); }
  .req-note { color: var(--fg-sub); font-size: var(--text-xs); }
  .switches > .switch-row + .switch-row { box-shadow: inset 0 1px 0 var(--muted); }
  .switch-row b { font-weight: 600; }
  .switch-row .small { color: var(--fg-sub); }
  .switch-row { cursor: pointer; }

  .note { display: flex; align-items: flex-start; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--radius); background: var(--muted); color: var(--fg); font-size: var(--text-sm); }
  .note > .ic { margin-top: 1px; }
  .note > div { display: grid; gap: var(--s2); min-width: 0; }
  .note-info { background: var(--cyan-soft); } .note-info > .ic { color: var(--cyan-text); }
  .note-warn { background: var(--amber-soft); } .note-warn > .ic { color: var(--amber-text); }
  .note-ok { background: var(--green-soft); } .note-ok > .ic { color: var(--green-text); }
  .note-err { background: var(--red-soft); } .note-err > .ic { color: var(--red-text); }

  .cred { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); border-radius: var(--radius); background: var(--bg-2); }
  .cred code { justify-self: start; }
  .cap { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s3) 0; }
  .cap + .cap { box-shadow: inset 0 1px 0 var(--muted); }
  .cap .ttl { display: block; font-weight: 600; font-size: var(--text-sm); }
  .cap .d { display: block; color: var(--fg-sub); font-size: var(--text-sm); }

  .checks { display: grid; gap: var(--s2); margin: 0; padding: 0; list-style: none; }
  .check { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); border-radius: var(--radius); background: var(--bg-2); }
  .check .st { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--muted); color: var(--fg-sub); }
  .check .lbl { display: grid; gap: 2px; min-width: 0; }
  .check .lbl > * { display: block; }
  .check .lbl small { color: var(--fg-sub); font-size: var(--text-sm); overflow-wrap: anywhere; }
  .check .state { font-size: var(--text-sm); font-weight: 600; color: var(--fg-sub); white-space: nowrap; }
  .check[data-s="run"] .st { background: var(--amber-soft); color: var(--amber-text); }
  .check[data-s="ok"] .st { background: var(--green-soft); color: var(--green-text); }
  .check[data-s="ok"] .state { color: var(--green-text); }
  .check[data-s="fail"] .st { background: var(--red-soft); color: var(--red-text); }
  .check[data-s="fail"] .state { color: var(--red-text); }
  .check[data-s="fail"] .lbl small { color: var(--fg); }
  .spin { animation: km-spin 0.9s linear infinite; }
  @keyframes km-spin { to { transform: rotate(360deg); } }

  .prov { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s4); align-items: start; }
  .prov-mark { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--muted); color: var(--fg); font-family: var(--font-display); font-weight: 700; font-size: 15px; }
  .prov-body { display: grid; gap: var(--s3); min-width: 0; }
  .prov-body h2 { font-size: var(--text-lg); }
  .cal-list { display: grid; gap: 0; }
  .link-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s3); align-items: center; }
  .link-card .lead { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--muted); }
  .link-card .t { display: block; font-weight: 600; }
  .link-card .d { display: block; color: var(--fg-sub); font-size: var(--text-sm); }

  .consent { width: min(100%, 520px); }
  .perm { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s3); padding: var(--s3) 0; }
  .perm + .perm { box-shadow: inset 0 1px 0 var(--muted); }
  .perm .ic { color: var(--ember-text); margin-top: 2px; }
  .perm b { display: block; }
  .perm span.d { display: block; color: var(--fg-sub); font-size: var(--text-sm); }

  /* previews */
  .tpl-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s5); align-items: start; }
  .email-card { display: grid; border-radius: var(--radius-tile); background: var(--card); box-shadow: var(--shadow-card), inset 0 0 0 1px var(--muted); overflow: hidden; }
  .email-meta { display: grid; gap: 4px; padding: var(--s3) var(--s4); background: var(--bg-2); font-size: var(--text-sm); }
  .email-meta > div { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--s2); }
  .email-meta dt { color: var(--fg-sub); }
  .email-meta dd { margin: 0; overflow-wrap: anywhere; }
  .email-body { display: grid; gap: var(--s3); padding: var(--s5) var(--s4); font-size: var(--text-sm); }
  .email-body h3 { font-size: var(--text-lg); overflow-wrap: anywhere; }
  .email-body h4 { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-sub); }
  .email-body ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
  .email-body .btn { justify-self: start; }
  .email-body .foot { color: var(--fg-sub); font-size: var(--text-xs); }
  .phone-frame { width: min(100%, 340px); padding: var(--s4); border-radius: 28px; background: var(--bg-2); box-shadow: inset 0 0 0 1px var(--muted); display: grid; gap: var(--s2); }
  .phone-frame .from { text-align: center; color: var(--fg-sub); font-size: var(--text-xs); }
  .bubble { justify-self: start; max-width: 88%; padding: 10px 14px; border-radius: 18px 18px 18px 6px; background: var(--muted); color: var(--fg); font-size: var(--text-sm); line-height: 1.45; overflow-wrap: anywhere; white-space: pre-wrap; }
  .counter { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; font-size: var(--text-sm); color: var(--fg-sub); }
  .tokens { display: flex; flex-wrap: wrap; gap: 6px; }

  .result-list { display: grid; gap: var(--s2); margin: 0; padding: 0; list-style: none; }
  .result-list li label { display: flex; align-items: center; gap: var(--s3); min-height: 44px; padding: 0 var(--s3); border-radius: var(--radius); background: var(--bg-2); cursor: pointer; }
  .result-list input { width: 20px; height: 20px; accent-color: var(--ember-btn); margin: 0; }

  @media (max-width: 1023px) {
    .tpl-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 767px) {
    .cred { grid-template-columns: minmax(0, 1fr) auto; }
    .cred .masked { grid-column: 1 / -1; grid-row: 2; }
    .prov { grid-template-columns: auto minmax(0, 1fr); }
    .prov > .chip { grid-column: 2; grid-row: 1; justify-self: start; }
    .prov-body { grid-column: 1 / -1; }
    .check { grid-template-columns: 36px minmax(0, 1fr); }
    .check .state { grid-column: 2; }
    .cap { grid-template-columns: auto minmax(0, 1fr); }
    .cap > .chip { grid-column: 2; justify-self: start; }
  }
</style>

<script>
(function () {
  'use strict';
  var h = KM.h, icon = KM.icon, fmt = KM.fmt, D = KM.data;
  var main = document.getElementById('main');
  KM.mountAppBar(document.getElementById('appbar'), { active: 'settings' });
  document.querySelector('.skip-link').addEventListener('click', function (e) { e.preventDefault(); main.focus(); });

  /* ------------------------------------------------------------ state (no secrets are ever persisted) */
  var KEY = 'km-meet-settings';
  var detectedTz = 'America/Los_Angeles';
  try { detectedTz = Intl.DateTimeFormat().resolvedOptions().timeZone || detectedTz; } catch (_) { /* keep default */ }
  var DEF = {
    tz: detectedTz,
    defaults: { waiting: true, scribe: true, dialin: true, dot: true },
    notif: { recReady: true, summary: true, responses: true, digest: false, smsStart: false, smsSummary: true, phone: '' },
    lk: { mode: 'managed', url: '', keyId: '', region: 'auto', testedAt: null },
    sms: { connected: false, keyLast4: '', profile: '', number: '', receipts: true, lastTest: null },
    voice: {
      numbers: D.telnyx.dialIn.map(function (n) { return { number: n.number, region: n.region, status: 'Active' }; }),
      sipName: D.telnyx.sipTrunk, pinLen: '8',
      greeting: 'Welcome to Know Meet. Please enter your meeting PIN, followed by the pound key.'
    },
    cal: {
      google: { connected: true, calendars: { work: true, team: true, personal: false }, addLink: true, window: '30', lastSync: null },
      outlook: { connected: true, calendars: { calendar: true, partners: true, birthdays: false }, addLink: true, window: '30', lastSync: null },
      caldav: { connected: false, server: '', user: '', calendars: { home: true }, addLink: false, window: '30', lastSync: null }
    },
    storage: { mode: 'managed', format: 'mp4', layout: 'speaker', res: '1080p', audioOnly: false, retention: '365', ipfs: true },
    s3: { saved: false, provider: 'r2', endpoint: '', region: 'auto', bucket: '', prefix: 'meet/', keyId: '', pathStyle: true, testedAt: null },
    ipfs: { mode: 'knowme', endpoint: '', rpc: 'http://127.0.0.1:5001', gateway: 'https://ipfs.io', pinAfter: true, testedAt: null },
    rec: { auto: true, live: true, lang: 'auto', speakers: true, kb: true, profanity: false },
    delivery: { on: true, transcript: true, summary: true, actions: true, recording: true, recipients: 'all', email: true, sms: true, timing: 'immediate', expiry: '30' },
    tpl: {
      subject: 'Summary: {meeting}',
      intro: 'Thanks for joining. Here is what we covered, the decisions we made, and who owns each next step.',
      sms: 'Your summary for {meeting} is ready:',

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function merge(a, b) {
    Object.keys(b || {}).forEach(function (k) {

      else if (bv !== undefined) a[k] = bv;
    });
    return a;
  }
  function load() {
    try { return merge(clone(DEF), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (_) { return clone(DEF); }
  }
  var ST = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (_) { /* storage unavailable */ } }

  /* ------------------------------------------------------------ ui helpers */
  var uid = 0;
  var RUN = 0; /* cancels timers when the route changes */
  function req() { return h('span', { class: 'req', 'aria-hidden': 'true', text: ' *' }); }
  function chip(text, cls, ic) { return h('span', { class: 'chip ' + (cls || '') }, ic ? icon(ic) : null, h('span', { text: text })); }
  function stateChip(text, kind) { return h('span', { class: 'chip chip-' + kind }, h('span', { class: 'pip', 'aria-hidden': 'true' }), h('span', { text: text })); }
  function note(kind, ic, children) { return h('div', { class: 'note note-' + kind, role: kind === 'err' ? 'alert' : null }, icon(ic), h('div', null, children)); }

    var kids = Array.prototype.slice.call(btn.childNodes);
    btn.disabled = true; btn.setAttribute('aria-busy', 'true');
    KM.clear(btn); btn.appendChild(icon('refresh', 'spin')); btn.appendChild(h('span', { text: label }));
    return function () { btn.disabled = false; btn.removeAttribute('aria-busy'); KM.clear(btn); kids.forEach(function (k) { btn.appendChild(k); }); };
  }
  function later(ms, fn) { var token = RUN; setTimeout(function () { if (token === RUN) fn(); }, ms); }
  function saved(msg) { save(); KM.toast(msg || 'Saved', 'check'); }
  function nowLabel() { return fmt.relDay(new Date()) + ' at ' + fmt.time(new Date()); }

  function field(o) {
    var id = o.id || ('f' + (++uid));
    var hintId = id + '-hint', errId = id + '-err';
    var described = (o.hint ? hintId + ' ' : '') + errId;
    var input;
    if (o.type === 'textarea') {
      input = h('textarea', { class: 'input', id: id, rows: String(o.rows || 3), placeholder: o.placeholder || null, maxlength: o.max ? String(o.max) : null,
        'aria-describedby': described, 'aria-required': o.required ? 'true' : null });
      input.value = o.value || '';
    } else {
      input = h('input', { class: 'input' + (o.mono ? ' mono' : ''), id: id, type: o.type || 'text', value: o.value || '', placeholder: o.placeholder || null,
        autocomplete: o.autocomplete || (o.type === 'password' ? 'new-password' : 'off'), spellcheck: o.mono || o.type === 'password' ? 'false' : null,
        readonly: o.readonly ? true : null, inputmode: o.inputmode || null, maxlength: o.max ? String(o.max) : null,
        'aria-describedby': described, 'aria-required': o.required ? 'true' : null });
    }
    var errText = h('span');
    var err = h('p', { class: 'field-error', id: errId }, icon('alert', 'ic-sm'), errText);
    var control = input;
    if (o.type === 'password') {
      var eye = h('button', { class: 'icon-btn', type: 'button', 'aria-pressed': 'false', 'aria-label': 'Show ' + o.label, onclick: function () {
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        eye.setAttribute('aria-pressed', show ? 'true' : 'false');
        eye.setAttribute('aria-label', (show ? 'Hide ' : 'Show ') + o.label);
        KM.setIcon(eye, show ? 'eye-off' : 'eye');
      } }, icon('eye'));
      control = h('div', { class: 'input-group' }, input, eye);
    } else if (o.copy) {
      control = h('div', { class: 'input-group' }, input,
        h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Copy ' + o.label, onclick: function () { KM.copy(input.value); } }, icon('copy')));
    }
    var hintEl = o.hint ? h('p', { class: 'hint', id: hintId, text: o.hint }) : null;
    var el = h('div', { class: 'field' },
      h('label', { for: id }, o.label, o.required ? req() : null, o.optional ? h('span', { class: 'sub', style: 'font-weight:400', text: ' (optional)' }) : null),
      hintEl, control, err);
    function setError(msg) {

      errText.textContent = msg || '';
      err.classList.toggle('show', !!msg);
    }
    function check() {
      var v = input.value.trim();
      var msg = null;
      if (o.required && !v) msg = o.requiredMsg || ('Enter ' + o.label.toLowerCase() + ' — this field is required.');
      else if (v && o.validate) msg = o.validate(v);
      setError(msg);
      return !msg;
    }
    input.addEventListener('blur', check);
    input.addEventListener('input', function () { if (input.getAttribute('aria-invalid') === 'true') check(); if (o.oninput) o.oninput(input.value); });

  }
  function selectField(o) {
    var id = o.id || ('f' + (++uid));
    var sel = h('select', { class: 'input', id: id, disabled: o.disabled ? true : null, 'aria-describedby': o.hint ? id + '-hint' : null,
      onchange: function () { if (o.onchange) o.onchange(sel.value); } },
      o.options.map(function (op) { return h('option', { value: op[0], selected: op[0] === o.value ? true : null, text: op[1] }); }));
    var hintEl = o.hint ? h('p', { class: 'hint', id: id + '-hint', text: o.hint }) : null;
    return { el: h('div', { class: 'field' }, h('label', { for: id }, o.label, o.required ? req() : null), hintEl, sel), input: sel, hintEl: hintEl };
  }
  function switchRow(o) {
    var id = o.id || ('sw' + (++uid));
    var input = h('input', { type: 'checkbox', id: id, role: 'switch', checked: o.checked ? true : null, disabled: o.disabled ? true : null,
      'aria-describedby': o.desc ? id + '-d' : null,
      onchange: function () { if (o.onchange) o.onchange(input.checked); } });
    var el = h('label', { class: 'switch-row', for: id },
      h('span', { class: 'copy' }, h('b', { text: o.label }), o.desc ? h('span', { class: 'small', id: id + '-d', text: o.desc }) : null),
      h('span', { class: 'switch' }, input, h('span', { class: 'track' }), h('span', { class: 'thumb' })));
    return { el: el, input: input };
  }
  function segField(label, options, value, onChange, disabled) {
    var id = 'seg' + (++uid);
    var wrap = h('div', { class: 'seg', role: 'group', 'aria-labelledby': id });
    options.forEach(function (o) {
      wrap.appendChild(h('button', { type: 'button', disabled: disabled ? true : null, 'aria-pressed': o[0] === value ? 'true' : 'false', onclick: function () {
        KM.$$('button', wrap).forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
        this.setAttribute('aria-pressed', 'true');
        onChange(o[0]);
      } }, o[2] ? icon(o[2], 'ic-sm') : null, h('span', { text: o[1] })));
    });
    return h('div', { class: 'field' }, h('span', { class: 'label', id: id, text: label }), h('div', null, wrap));
  }
  function radioGroup(legend, name, options, value, onChange) {
    return h('fieldset', null, h('legend', { text: legend }), options.map(function (o) {
      var id = name + '-' + o[0];
      return h('label', { class: 'check-row', for: id },
        h('input', { type: 'radio', name: name, id: id, value: o[0], checked: o[0] === value ? true : null, onchange: function () { onChange(o[0]); } }),
        h('span', null, h('span', { style: 'display:block;font-weight:600', text: o[1] }), o[2] ? h('span', { class: 'small sub', style: 'display:block', text: o[2] }) : null));
    }));
  }
  function checkRow(id, label, desc, checked, onChange) {
    return h('label', { class: 'check-row', for: id },
      h('input', { type: 'checkbox', id: id, checked: checked ? true : null, onchange: function () { onChange.call(this, this.checked); } }),
      h('span', null, h('span', { style: 'display:block;font-weight:600', text: label }), desc ? h('span', { class: 'small sub', style: 'display:block', text: desc }) : null));
  }
  function panel(title, desc, children, actions) {
    var hid = 'p' + (++uid);
    return h('section', { class: 'panel', 'aria-labelledby': hid },
      h('div', { class: 'panel-head' },
        h('div', null, h('h2', { id: hid, class: 'panel-h', text: title }), desc ? h('p', { text: desc }) : null),
        actions || null),
      children);
  }
  function maskTail(last4) { return '••••••••••••' + (last4 || ''); }

  /* staged checks */
  function checksList(steps) {

    var retry = h('button', { class: 'btn btn-primary', type: 'button', onclick: function () {
      KM.clear(status);
      cl.rows.forEach(function (r) { r.li.setAttribute('data-s', 'wait'); r.state.textContent = 'Waiting'; });
      var restore = busy(retry, 'Retrying…');
      runChecks(cl, steps).then(function (res) {
        restore();
        status.appendChild(res.ok
          ? note('ok', 'check', ['The test passed this time. ', h('a', { href: '#storage-s3', text: 'Go back and save your bucket' }), '.'])
          : note('err', 'alert', 'Still failing: bucket ' + f.bucket + ' was not found. Fix the bucket name or create the bucket, then edit your settings.'));
      });
    } }, icon('refresh'), h('span', { text: 'Retry test' }));
    c.appendChild(panel('What failed', providerName(f.provider) + ' · ' + f.endpoint, h('div', { class: 'stack' }, note('err', 'alert', [h('b', { text: 'Step 2 of 4 — Write test object. ' }), 'Bucket not found: ' + f.bucket]), cl.el, status)));
    var raw = 'PUT /' + f.bucket + '/' + f.object + (f.pathStyle ? '  (path style)' : '') + '\n' +
      'HTTP/1.1 404 Not Found\n\n' +
      '<?xml version="1.0" encoding="UTF-8"?>\n<Error>\n  <Code>NoSuchBucket</Code>\n  <Message>The specified bucket does not exist.</Message>\n  <BucketName>' + f.bucket + '</BucketName>\n</Error>';
    c.appendChild(panel('Raw provider error', null, h('pre', { class: 'code', tabindex: '0', 'aria-label': 'Raw provider error', text: raw }),
      h('button', { class: 'btn btn-sm', type: 'button', onclick: function () { KM.copy(raw); } }, icon('copy', 'ic-sm'), h('span', { text: 'Copy' }))));
    var fixes = [
      'Check the bucket name for typos. Names are lowercase and must match exactly.',
      'Create the bucket in your ' + providerName(f.provider) + ' console if it doesn’t exist yet.',
      'Confirm the endpoint points at the right account and region.',
      'Make sure the access key can PutObject, GetObject and DeleteObject on this bucket.',
      'For non-AWS providers, keep Force path style on.'
    ];
    c.appendChild(panel('How to fix it', 'Tick items off as you go.', h('div', null, fixes.map(function (t, i) { return checkRow('fix-' + i, t, null, false, function () {}); }))));
    c.appendChild(h('div', { class: 'form-foot' }, retry,
      h('a', { class: 'btn', href: '#storage-s3' }, icon('edit'), h('span', { text: 'Edit storage settings' })),
      h('a', { class: 'btn btn-ghost', href: '#storage', text: 'Back to storage' })));
  }

  /* ------------------------------------------------------------ #recording */
  function vRecording(c) {
    var r = ST.rec;
    head(c, 'recording', 'Recording & transcription', 'Defaults for meetings you host. Hosts can still start or stop recording in the room.');
    c.appendChild(panel('Recording', null, h('div', { class: 'switches' },
      switchRow({ label: 'Auto-record meetings I host', desc: 'Starts a Room Composite recording once everyone present has consented.', checked: r.auto, onchange: function (v) { r.auto = v; saved(); } }).el,
      switchRow({ label: 'Ask participants for consent', desc: 'Always on. Everyone sees a recording notice and must agree before recording starts; people who join later see it before they enter.', checked: true, disabled: true }).el)));
    var lang = selectField({ label: 'Transcription language', value: r.lang, onchange: function (v) { r.lang = v; saved('Language saved'); },
      options: [['auto', 'Detect automatically'], ['en-US', 'English (US)'], ['en-GB', 'English (UK)'], ['es', 'Spanish'], ['fr', 'French'], ['de', 'German'], ['pt-BR', 'Portuguese (Brazil)'], ['hi', 'Hindi'], ['ja', 'Japanese']] });
    c.appendChild(panel('Transcription', null, h('div', { class: 'stack' },
      h('div', { class: 'switches' },
        switchRow({ label: 'Live transcription', desc: 'Transcribe as people speak and show captions in the room.', checked: r.live, onchange: function (v) { r.live = v; saved(); } }).el,
        switchRow({ label: 'Speaker labels', desc: 'Attribute each line to a participant or agent.', checked: r.speakers, onchange: function (v) { r.speakers = v; saved(); } }).el,
        switchRow({ label: 'Add transcript to meeting knowledge in real time', desc: 'Every agent in the room, including Concierge, can answer from what has been said so far.', checked: r.kb, onchange: function (v) { r.kb = v; saved(); } }).el,
        switchRow({ label: 'Profanity filter', desc: 'Masks profanity in captions, transcripts and summaries.', checked: r.profanity, onchange: function (v) { r.profanity = v; saved(); } }).el),
      lang.el)));
    c.appendChild(h('section', { class: 'panel', 'aria-labelledby': 'guest-h' },
      h('div', { class: 'od-cluster', style: 'justify-content: space-between' }, h('h2', { id: 'guest-h', class: 'panel-h', text: 'Guest meetings' }), KM.lockBadge('Not editable')),
      h('p', { class: 'small sub', text: 'Meetings started by someone who isn’t signed in are never recorded. They get live transcription and the Concierge only, and the transcript is deleted when the meeting ends — it isn’t saved or sent to anyone.' })));
  }

  /* ------------------------------------------------------------ #delivery */
  function vDelivery(c) {
    var d = clone(ST.delivery);
    head(c, 'delivery', 'Summary delivery', 'When a meeting closes, KnowMe generates a summary and action items and sends them with the transcript.',
      h('a', { class: 'btn', href: '#templates' }, icon('eye'), h('span', { text: 'Preview messages' })));
    var body = h('fieldset', { disabled: d.on ? null : true, class: 'stack' }, h('legend', { class: 'sr-only', text: 'Delivery options' }));
    c.appendChild(h('section', { class: 'panel', 'aria-label': 'Automatic delivery' },
      switchRow({ label: 'Send automatically at meeting close', desc: 'Turn off to send summaries yourself from each recording.', checked: d.on, onchange: function (v) { d.on = v; body.disabled = !v; } }).el));
    var whatErr = h('p', { class: 'field-error', id: 'what-err' }, icon('alert', 'ic-sm'), h('span', { text: 'Choose at least one thing to send, or turn automatic delivery off.' }));
    var chErr = h('p', { class: 'field-error', id: 'ch-err' }, icon('alert', 'ic-sm'), h('span', { text: 'Choose at least one channel.' }));
    function cb(k) { return function (v) { d[k] = v; whatErr.classList.remove('show'); chErr.classList.remove('show'); }; }
    var reviewNote = h('div');
    function drawReview() {
      KM.clear(reviewNote);
      if (d.timing === 'review') reviewNote.appendChild(note('info', 'clock', 'Summaries wait in a review queue on each recording’s Delivery tab. Nothing is sent until you approve it.'));
    }
    body.appendChild(panel('What to send', null, h('fieldset', { 'aria-describedby': 'what-err' }, h('legend', { class: 'sr-only', text: 'What to send' }),
      checkRow('w-summary', 'Summary', 'A short narrative of the meeting and its decisions.', d.summary, cb('summary')),
      checkRow('w-actions', 'Action items', 'Each item with its owner and due date.', d.actions, cb('actions')),
      checkRow('w-transcript', 'Full transcript', 'Speaker-attributed, with timestamps.', d.transcript, cb('transcript')),
      checkRow('w-recording', 'Recording link', 'Only for recorded meetings.', d.recording, cb('recording')), whatErr)));
    body.appendChild(panel('Recipients', null, radioGroup('Who receives it', 'recip', [
      ['all', 'All participants', 'Including invitees without a KnowMe account — they open the link without signing in.'],
      ['signed', 'Only signed-in participants', null],
      ['me', 'Only me', null]], d.recipients, function (v) { d.recipients = v; })));
    var smsDesc = ST.sms.connected ? 'Sent from ' + ST.sms.number + ' to participants with a phone number.' : 'Needs Telnyx SMS — not connected yet.';
    body.appendChild(panel('Channels', null, h('div', { class: 'stack-sm' },
      h('fieldset', { 'aria-describedby': 'ch-err' }, h('legend', { class: 'sr-only', text: 'Channels' }),
        checkRow('ch-email', 'Email', 'Full summary in the message body.', d.email, cb('email')),
        checkRow('ch-sms', 'SMS link via Telnyx', smsDesc, d.sms, cb('sms')), chErr),
      ST.sms.connected ? null : note('warn', 'sms', ['SMS links won’t send until you ', h('a', { href: '#telnyx-sms', text: 'connect Telnyx SMS' }), '.']))));
    body.appendChild(panel('Timing', null, h('div', { class: 'stack' },
      radioGroup('When to send', 'timing', [['immediate', 'Immediately when processing completes', null], ['review', 'After I review', 'Hold summaries until you approve them.']], d.timing, function (v) { d.timing = v; drawReview(); }),
      reviewNote,
      selectField({ label: 'Links expire after', value: d.expiry, hint: 'Applies to transcript and recording links for people without an account.', options: [['7', '7 days'], ['30', '30 days'], ['90', '90 days'], ['never', 'Never']], onchange: function (v) { d.expiry = v; } }).el)));
    drawReview();
    c.appendChild(body);
    var saveBtn = h('button', { class: 'btn btn-primary', type: 'button', onclick: function () {
      if (d.on && !(d.summary || d.actions || d.transcript || d.recording)) { whatErr.classList.add('show'); whatErr.scrollIntoView({ block: 'center' }); return; }
      if (d.on && !(d.email || d.sms)) { chErr.classList.add('show'); chErr.scrollIntoView({ block: 'center' }); return; }
      var restore = busy(saveBtn, 'Saving…');
      later(700, function () { restore(); ST.delivery = clone(d); saved('Delivery settings saved'); });
    } }, icon('check'), h('span', { text: 'Save delivery settings' }));
    c.appendChild(h('div', { class: 'form-foot' }, saveBtn, h('a', { class: 'btn', href: '#templates' }, icon('eye'), h('span', { text: 'Preview' }))));
  }

  /* ------------------------------------------------------------ #templates */
  var SHORT = 'meet.know-me.tools/s/7Qx2';
  function smsStats(text) {
    var gsm = /^[\x20-\x7E\n]*$/.test(text);
    var single = gsm ? 160 : 70, multi = gsm ? 153 : 67;
    var segs = text.length <= single ? 1 : Math.ceil(text.length / multi);
    return { len: text.length, segs: segs, limit: segs === 1 ? single : multi * segs, gsm: gsm };
  }
  function vTemplates(c) {
    var t = clone(ST.tpl);
    var u = KM.auth.get();
    var m = D.meeting('partner-onboarding');
    var nextM = D.meeting('cohort-kickoff');
    var sum = { paras: 'Jordan, Avery and Marcus agreed on a two-phase rollout: sandbox access first, then production once the security review closes.',
      actions: [['Issue sandbox credentials', 'Jordan Reyes', 'Oct 19'], ['Confirm required API scopes', 'Marcus Oyelaran', 'Oct 20'], ['Schedule the security review', 'Avery Chen', 'Oct 23']] };
    function fill(s, mt) {
      mt = mt || m;
      return String(s).replace(/\{meeting\}/g, mt.title).replace(/\{host\}/g, mt.host).replace(/\{date\}/g, fmt.day(mt.start) + ' ' + fmt.time(mt.start));
    }
    head(c, 'templates', 'Message templates', 'What participants receive. Edit the subject and intro; previews update as you type.',
      h('a', { class: 'btn', href: '#delivery' }, icon('settings'), h('span', { text: 'Delivery settings' })));
    c.appendChild(h('div', { class: 'tokens', 'aria-label': 'Available placeholders' },
      h('span', { class: 'small sub', text: 'Placeholders:' }), ['{meeting}', '{host}', '{date}'].map(function (x) { return h('code', { text: x }); })));

    /* summary email */
    var subj = field({ label: 'Email subject', required: true, value: t.subject, max: 120, oninput: function (v) { t.subject = v; drawEmail(); } });
    var intro = field({ label: 'Email intro', type: 'textarea', required: true, value: t.intro, max: 400, rows: 4, oninput: function (v) { t.intro = v; drawEmail(); } });
    var emailPrev = h('div', { 'aria-live': 'off' });
    function drawEmail() {
      KM.clear(emailPrev);
      emailPrev.appendChild(h('article', { class: 'email-card', 'aria-label': 'Summary email preview' },
        h('dl', { class: 'email-meta' },
          h('div', null, h('dt', { text: 'From' }), h('dd', { text: 'Know Meet <summaries@know-me.tools>' })),
          h('div', null, h('dt', { text: 'To' }), h('dd', { text: 'avery.chen@northwind.io' })),
          h('div', null, h('dt', { text: 'Subject' }), h('dd', null, h('b', { text: fill(t.subject) || '(no subject)' })))),
        h('div', { class: 'email-body' },
          h('h3', { text: m.title }),
          h('p', { class: 'sub', text: fmt.day(m.start) + ' · ' + fmt.mins(m.durationMin) + ' · Hosted by ' + m.host }),
          h('p', { text: fill(t.intro) }),
          h('h4', { text: 'Summary' }), h('p', { text: sum.paras }),
          h('h4', { text: 'Action items' }),
          h('ul', null, sum.actions.map(function (a) { return h('li', null, h('b', { text: a[0] }), ' — ' + a[1] + ', due ' + a[2]); })),
          h('div', { class: 'btn-row' },
            h('span', { class: 'btn btn-primary btn-sm', 'aria-hidden': 'true', text: 'Read the transcript' }),
            h('span', { class: 'btn btn-sm', 'aria-hidden': 'true', text: 'Watch the recording' })),
          h('p', { class: 'foot', text: (ST.delivery.expiry === 'never' ? 'Links don’t expire.' : 'Links expire in ' + ST.delivery.expiry + ' days.') + ' You received this because you joined this meeting.' }))));
    }
    drawEmail();

    /* summary sms */
    var smsIn = field({ label: 'SMS intro', required: true, value: t.sms, max: 200, oninput: function (v) { t.sms = v; drawSms(); } });
    var smsPrev = h('div');
    var smsCount = h('div', { class: 'counter', 'aria-live': 'polite' });
    var smsErr = h('div');
    function smsText() { return fill(t.sms) + ' ' + SHORT + ' Reply STOP to opt out.'; }
    function drawSms() {
      var txt = smsText(), st = smsStats(txt);
      KM.clear(smsPrev); KM.clear(smsCount); KM.clear(smsErr);
      smsPrev.appendChild(phone(ST.sms.number || D.telnyx.smsFrom, txt));
      smsCount.appendChild(h('span', { class: 'mono', text: st.len + ' / ' + st.limit }));
      smsCount.appendChild(h('span', { text: 'characters' }));
      smsCount.appendChild(st.segs > 2 ? stateChip(st.segs + ' segments', 'red') : stateChip(st.segs + (st.segs === 1 ? ' segment' : ' segments'), 'green'));
      if (!st.gsm) smsCount.appendChild(h('span', { class: 'xsmall', text: 'Special characters use 70-character segments.' }));
      if (st.segs > 2) smsErr.appendChild(note('err', 'alert', 'This SMS needs ' + st.segs + ' segments. Shorten the intro to fit in 2 or fewer.'));
    }
    drawSms();

    /* invites */
    var invSubj = field({ label: 'Invite email subject', required: true, value: t.inviteSubject, max: 120, oninput: function (v) { t.inviteSubject = v; drawInvites(); } });
    var invSms = field({ label: 'Invite SMS intro', required: true, value: t.inviteSms, max: 160, oninput: function (v) { t.inviteSms = v; drawInvites(); } });
    var invPrev = h('div', { class: 'stack' });
    var invCount = h('div', { class: 'counter', 'aria-live': 'polite' });
    function inviteSmsText() {
      return fill(t.inviteSms, nextM) + ' Join: meet.know-me.tools/j/' + nextM.joinCode + ' Dial-in: ' + nextM.dialIn.number + ' PIN ' + nextM.dialIn.pin + '# Reply STOP to opt out.';
    }
    function drawInvites() {
      KM.clear(invPrev); KM.clear(invCount);
      invPrev.appendChild(h('article', { class: 'email-card', 'aria-label': 'Invite email preview' },
        h('dl', { class: 'email-meta' },
          h('div', null, h('dt', { text: 'From' }), h('dd', { text: u.name + ' via Know Meet' })),
          h('div', null, h('dt', { text: 'To' }), h('dd', { text: 'dana@lumenlabs.co' })),
          h('div', null, h('dt', { text: 'Subject' }), h('dd', null, h('b', { text: fill(t.inviteSubject, nextM) || '(no subject)' })))),
        h('div', { class: 'email-body' },
          h('h3', { text: nextM.title }),
          h('p', { text: fmt.date(nextM.start) + ' · ' + fmt.mins(nextM.durationMin) }),
          h('span', { class: 'btn btn-primary btn-sm', 'aria-hidden': 'true', text: 'Join in browser' }),
          h('p', null, 'Or dial ', h('b', { text: nextM.dialIn.number }), ' and enter PIN ', h('b', { text: nextM.dialIn.pin + '#' })),
          h('p', { class: 'foot', text: 'No account needed. This meeting may be recorded and is transcribed live; you’ll be asked for consent before recording starts.' }))));
      var txt = inviteSmsText(), st = smsStats(txt);
      invPrev.appendChild(phone(ST.sms.number || D.telnyx.smsFrom, txt));
      invCount.appendChild(h('span', { class: 'mono', text: st.len + ' / ' + st.limit }));
      invCount.appendChild(h('span', { text: 'characters' }));
      invCount.appendChild(st.segs > 2 ? stateChip(st.segs + ' segments', 'red') : stateChip(st.segs + (st.segs === 1 ? ' segment' : ' segments'), 'green'));
    }
    drawInvites();

    c.appendChild(panel('Summary email', 'Sent at meeting close to recipients chosen in delivery settings.', h('div', { class: 'tpl-grid' },
      h('div', { class: 'stack' }, subj.el, intro.el), emailPrev)));
    c.appendChild(panel('Summary SMS', 'Sent via Telnyx to participants with a phone number. Keep it to 2 segments.', h('div', { class: 'tpl-grid' },
      h('div', { class: 'stack' }, smsIn.el, smsCount, smsErr), smsPrev)));
    c.appendChild(panel('Invites', 'What invitees receive by email and SMS. Invitees never need an account.', h('div', { class: 'tpl-grid' },
      h('div', { class: 'stack' }, invSubj.el, invSms.el, invCount), invPrev)));

    var saveBtn = h('button', { class: 'btn btn-primary', type: 'button', onclick: function () {
      var list = [subj, intro, smsIn, invSubj, invSms], oks = list.map(function (f) { return f.check(); });
      var bad = list[oks.indexOf(false)];
      if (bad) { bad.input.focus(); return; }
      if (smsStats(smsText()).segs > 2 || smsStats(inviteSmsText()).segs > 2) { smsIn.setError('Shorten this so the SMS fits in 2 segments.'); smsIn.input.focus(); return; }
      var restore = busy(saveBtn, 'Saving…');
      later(700, function () { restore(); ST.tpl = clone(t); saved('Templates saved'); });
    } }, icon('check'), h('span', { text: 'Save templates' }));
    var resetBtn = h('button', { class: 'btn btn-ghost', type: 'button', onclick: function () {
      KM.confirm({ title: 'Reset templates?', body: 'Your subject and intro text go back to the KnowMe defaults.', confirmLabel: 'Reset' }).then(function (ok) {
        if (!ok) return;
        ST.tpl = clone(DEF.tpl); saved('Templates reset'); vRoute();
      });
    } }, h('span', { text: 'Reset to defaults' }));
    c.appendChild(h('div', { class: 'form-foot' }, saveBtn, resetBtn, h('span', { class: 'req-note', text: '* Required' })));
  }
  function phone(from, text) {
    return h('div', { class: 'phone-frame', role: 'img', 'aria-label': 'SMS preview: ' + text },
      h('span', { class: 'from', text: 'Text message · from ' + from }),
      h('div', { class: 'bubble', text: text }));
  }

  /* ------------------------------------------------------------ routing */
  var VIEWS = {
    'account': vAccount, 'notifications': vNotifications, 'livekit': vLivekit, 'telnyx-sms': vTelnyxSms, 'telnyx-voice': vTelnyxVoice,
    'calendars': vCalendars, 'calendar-connect': vCalendarConnect, 'storage': vStorage, 'storage-s3': vStorageS3, 'storage-ipfs': vStorageIpfs,
    'storage-test-failed': vStorageFailed, 'recording': vRecording, 'delivery': vDelivery, 'templates': vTemplates
  };
  var lastKey = null;
  function render(key, arg) {
    RUN++;
    if (key !== lastKey) { if (key !== 'livekit') LK.draft = null; if (key !== 'telnyx-sms') SMSF.open = false; }
    lastKey = key;
    if (!KM.auth.isSignedIn()) {
      document.title = 'Settings · Know Meet';
      KM.clear(main);
      main.appendChild(h('div', { class: 'page-head' }, h('div', null, h('span', { class: 'eyebrow', text: 'Settings' }), h('h1', { text: 'Settings' }))));
      var slot = h('div');
      main.appendChild(slot);
      KM.gate(slot, { title: 'Sign in to manage settings',
        reason: 'LiveKit, Telnyx, calendars, storage and delivery settings belong to your account. Guests can still start a meeting with the Concierge.',
        next: 'settings.html' + location.hash });
      return;
    }
    var c = shell(key);
    VIEWS[key](c, arg);
  }
  var handlers = {};
  Object.keys(VIEWS).forEach(function (k) { handlers[k] = function (arg) { render(k, arg); }; });
  var router = KM.route(handlers, 'account');
  function vRoute() { router.refresh(); }
  KM.auth.onChange(function () { router.refresh(); });
})();
</script>
</body>
