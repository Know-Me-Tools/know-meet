# Test-only same-origin entry for the packaged run (wr07 task 7.4, used by wr09 task 9.2).
# It imitates the cluster HTTPRoute split: /api/* goes to the token service, everything else
# to the static web image. It is NOT the Gateway: it adds no HSTS, no CSP and no redirects, so
# header and TLS behaviour are proven only by the hosted run (WR-3).
#
# Mounted over /etc/nginx/conf.d/default.conf in nginx-unprivileged (listens on 8080, non-root).
# Service names resolve on the compose network (tooling/release/compose.yaml).

server {
    listen 8080;
    server_name _;

    # The token service accepts at most 4096 body bytes; refuse larger bodies here too.
    client_max_body_size 8k;

    # Same split as the cluster route. No URI part on proxy_pass: the /api prefix is kept.
    location ^~ /api/ {
        proxy_pass http://token-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Appends the connecting address, as Envoy Gateway does: KM_TRUSTED_PROXY_HOPS=1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        # Origin and Content-Type reach the service unchanged; nginx does not alter them.
    }

    location / {
        proxy_pass http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
