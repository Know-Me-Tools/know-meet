# Gate 16.1 (c16-agentic-core-gates), Windows WebView2 leg, adopted from
# spikes/agentic-ui/tauri-shell/ci/webview2-gate-16-1.yml. Steps and pass criteria:
# spikes/agentic-ui/own/webview2-runbook.md. Runs on native x64 and arm64 Windows runners and
# uploads the raw records and summary per arch. Needs no secrets. Off the per-change path for
# everything outside spikes/agentic-ui/**.
name: webview2-gate

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Repeats per scenario (>= 6; the first steps of a run are excluded until the state is staged)
        default: "6"
  pull_request:
    branches: [main]
    paths:
      - "spikes/agentic-ui/**"
      - ".github/workflows/webview2-gate.yml"

concurrency:
  group: webview2-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webview2-window-states:
    name: webview2 gate 16.1 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2025 }
          - { arch: arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: pwsh
    env:
      SPIKE: spikes/agentic-ui
      RUSTC_WRAPPER: ""
      REPEATS: ${{ inputs.repeats || '6' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Validate inputs
        run: |
          if ($env:REPEATS -notmatch '^\d+$' -or [int]$env:REPEATS -lt 6) { throw "repeats must be an integer >= 6, got '$env:REPEATS'" }

      - name: Install pinned Rust from rust-toolchain.toml
        run: rustup show active-toolchain; if ($LASTEXITCODE -ne 0) { rustup toolchain install }

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "spikes/agentic-ui/tauri-shell/src-tauri -> target"
          key: webview2-gate-${{ matrix.arch }}
          cache-bin: true

      - name: Record environment
        run: |
          node --version; pnpm --version; rustc --version
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution
          [System.Environment]::OSVersion.VersionString
          $env:PROCESSOR_ARCHITECTURE

      - name: Install Tauri CLI (pinned, tooling/versions.toml frameworks.tauri_cli)
        run: |
          $version = node tooling/repo-rules/src/print-version.ts frameworks tauri_cli
          $installed = (cargo tauri --version 2>$null)
          if ($installed -ne "tauri-cli $version") { cargo install tauri-cli --version $version --locked }

      - name: Install spike packages (standalone, not the root workspace)
        run: |
          pnpm --dir "$env:SPIKE/harness" install --ignore-workspace --frozen-lockfile
          pnpm --dir "$env:SPIKE/own" install --ignore-workspace --frozen-lockfile

      - name: Unit tests and build of prototype O
        run: |
          pnpm --dir "$env:SPIKE/own" test
          pnpm --dir "$env:SPIKE/own" build

      - name: Build the Tauri gate shell (WebView2)
        working-directory: ${{ env.SPIKE }}/own
        run: node gates/scripts/build-gate-shell.ts

      - name: Start the harness mock server and collector on 127.0.0.1:4317
        working-directory: ${{ env.SPIKE }}/harness
        run: |
          Start-Process -FilePath node -ArgumentList 'src/server/main.ts' -RedirectStandardOutput harness.log -RedirectStandardError harness.err -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:4317/healthz | Out-Null; Write-Output 'harness up'; exit 0 } catch { Start-Sleep -Seconds 1 }
          }
          throw 'harness did not start'

      - name: Window states (focused, unfocused, occluded, minimised)
        working-directory: ${{ env.SPIKE }}/own
        run: |
          foreach ($state in 'focused', 'unfocused', 'occluded', 'minimised') {
            node gates/scripts/window-state-run-windows.ts --state $state --repeats $env:REPEATS
            if ($LASTEXITCODE -ne 0) { Write-Warning "state $state exited $LASTEXITCODE" }
          }

      - name: Summarise against the focused baseline
        working-directory: ${{ env.SPIKE }}/own
        run: |
          $ids = Get-ChildItem gates/raw/16-1-webview2/meta-*.json | ForEach-Object { $_.BaseName -replace '^meta-', '' }
          node gates/scripts/summarize-window-states.ts --dir 16-1-webview2 @ids | Tee-Object gates/raw/16-1-webview2/summary.md
          Get-Content gates/raw/16-1-webview2/summary.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: webview2-gate-16-1-${{ matrix.arch }}
          path: |
            ${{ env.SPIKE }}/own/gates/raw/16-1-webview2/
            ${{ env.SPIKE }}/harness/reports/webview-driver/
            ${{ env.SPIKE }}/harness/harness.log
            ${{ env.SPIKE }}/harness/harness.err
          if-no-files-found: warn
