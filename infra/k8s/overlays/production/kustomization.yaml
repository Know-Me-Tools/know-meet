# Production: the path Argo CD Application know-meet syncs (infra/argocd/know-meet.yaml): the
# namespace, the workloads and the routes. The shared gateway objects are owned by
# Know-Me-Tools/platform (Application platform-gateway).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - routes.yaml
  - security-headers.yaml

# Release pin. The `deploy` job of .github/workflows/images.yml rewrites these four lines for
# each main build it pushed (continuous deployment): `newTag` is the commit SHA, `digest` the
# digest that run pushed. kustomize renders `image:tag@digest`, so the cluster pulls by digest
# and the tag only records which commit it is. Keep the order name, newTag, digest; edit
# nothing else in this block. Never `latest`.
images:
  - name: ghcr.io/know-me-tools/know-meet-web
    newTag: cfe7ecf263cc5241f93874900cffde7bf7f1f110
    digest: sha256:5bf2bade0b261da015658ad237d0a73350c14d1c276f5b515c5351973c4c10dc
  - name: ghcr.io/know-me-tools/know-meet-token-service
    newTag: cfe7ecf263cc5241f93874900cffde7bf7f1f110
    digest: sha256:b3bc739f5bec8af3c6f241aa7098cd634fcdec4322a6ec7af7744341c099222c

# Copies each generated header value (security-headers.yaml, a local-config ConfigMap that
# kustomize reads but does not emit) into the ResponseHeaderModifier of every HTTPS rule.
replacements:
  - source:
      kind: ConfigMap
      name: know-meet-security-headers
      fieldPath: data.strict-transport-security
    targets:
      - select:
          kind: HTTPRoute
          name: know-meet-https
        fieldPaths:
          - spec.rules.*.filters.[type=ResponseHeaderModifier].responseHeaderModifier.set.[name=Strict-Transport-Security].value
  - source:
      kind: ConfigMap
      name: know-meet-security-headers
      fieldPath: data.content-security-policy
    targets:
      - select:
          kind: HTTPRoute
          name: know-meet-https
        fieldPaths:
          - spec.rules.*.filters.[type=ResponseHeaderModifier].responseHeaderModifier.set.[name=Content-Security-Policy].value
  - source:
      kind: ConfigMap
      name: know-meet-security-headers
      fieldPath: data.x-content-type-options
    targets:
      - select:
          kind: HTTPRoute
          name: know-meet-https
        fieldPaths:
          - spec.rules.*.filters.[type=ResponseHeaderModifier].responseHeaderModifier.set.[name=X-Content-Type-Options].value
  - source:
      kind: ConfigMap
      name: know-meet-security-headers
      fieldPath: data.x-frame-options
    targets:
      - select:
          kind: HTTPRoute
          name: know-meet-https
        fieldPaths:
          - spec.rules.*.filters.[type=ResponseHeaderModifier].responseHeaderModifier.set.[name=X-Frame-Options].value
  - source:
      kind: ConfigMap
      name: know-meet-security-headers
      fieldPath: data.referrer-policy
    targets:
      - select:
          kind: HTTPRoute
          name: know-meet-https
        fieldPaths:
          - spec.rules.*.filters.[type=ResponseHeaderModifier].responseHeaderModifier.set.[name=Referrer-Policy].value
  - source:
      kind: ConfigMap
      name: know-meet-security-headers
      fieldPath: data.permissions-policy
    targets:
      - select:
          kind: HTTPRoute
          name: know-meet-https
        fieldPaths:
          - spec.rules.*.filters.[type=ResponseHeaderModifier].responseHeaderModifier.set.[name=Permissions-Policy].value
