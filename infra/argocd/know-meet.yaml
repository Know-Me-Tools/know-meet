# The Argo CD Application for the Know Meet app (namespace know-meet). Project know-meet
# (infra/argocd/projects.yaml) limits it to this repository, namespace know-meet and the kinds
# it renders. The shared gateway is Application platform-gateway in Know-Me-Tools/platform. Applied by the
# operator:
#   kubectl --context gke_knowme-corporate_us-south1_main apply -f infra/argocd/know-meet.yaml
# The repository is public, so Argo CD clones it over HTTPS with no repository credential.
#
# Sync policy:
# - automated: a merged pull request is the deployment; nobody runs a manual sync.
# - prune: true: an app object removed from Git (a route, a Service) is removed from the
#   cluster.
# - selfHeal: true: a manual edit to a managed object is reverted to Git. Changes to the managed
#   objects therefore go through this repository by pull request.
# - No CreateNamespace: the know-meet Namespace is a manifest in Git (infra/k8s/base).
# - No resources finalizer: deleting the Application leaves every object running; removal is a
#   deliberate, separate step.
#
# Ordering: HTTPRoutes need no ordering against the Gateway (Know-Me-Tools/platform): a route
# created before its Gateway is accepted once the Gateway exists.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: know-meet
  namespace: argocd
spec:
  project: know-meet
  source:
    repoURL: https://github.com/Know-Me-Tools/know-meet.git
    targetRevision: main
    path: infra/k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: know-meet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
