# Argo CD Application for the shared platform objects: GatewayClass eg, Gateway main-gateway and
# Certificate meet-know-me-tools (infra/platform). Project know-meet-platform
# (infra/argocd/projects.yaml) allows only those kinds, only in envoy-gateway-system.
#   kubectl --context gke_knowme-corporate_us-south1_main apply -f infra/argocd/know-meet-platform.yaml
#
# Sync policy as for know-meet (infra/argocd/know-meet.yaml). All three objects carry
# Prune=false,Delete=false, so removing their files or deleting this Application never takes the
# public address or the certificate away from other tenants. The Certificate is in sync wave -1:
# Argo CD applies the Gateway only once the Certificate is Ready.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: know-meet-platform
  namespace: argocd
spec:
  project: know-meet-platform
  source:
    repoURL: https://github.com/Know-Me-Tools/know-meet.git
    targetRevision: main
    path: infra/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
