# TLS certificate for the Gateway's HTTPS listener, issued by DNS-01 through Cloudflare
# (the ClusterIssuers' default solver; no Gateway or HTTP route is involved).
#
# Staging first, then production, by pull request. To move to production, change ONE line:
#   name: letsencrypt-staging   ->   name: letsencrypt-prod      (spec.issuerRef.name)
# cert-manager reissues when issuerRef changes and overwrites the same Secret in place, so
# the listener never points at a missing Secret during the switch. Nothing has to be deleted
# afterwards: there is no separate staging Secret, and revisionHistoryLimit drops the old
# CertificateRequest.
#
# Sync wave -1: Argo CD waits for this Certificate to be Ready before it applies the Gateway
# (wave 0), so on first sync the listener never references a Secret that does not exist yet.
#
# No cert-manager.io/cluster-issuer annotation on the Gateway: that would make cert-manager
# create a second Certificate for the same Secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: meet-know-me-tools
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  secretName: meet-know-me-tools-tls
  dnsNames:
    - meet.know-me.tools
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-staging
  revisionHistoryLimit: 1
