# The shared Gateway. Envoy Gateway creates its LoadBalancer Service in this namespace when
# the Gateway is accepted; that public address is new (no LoadBalancer existed).
#
# HOSTNAMES: external-dns on this cluster has no domain filter and policy upsert-only, so any
# hostname that reaches a route attached here becomes a public DNS record nothing deletes.
# Both listeners therefore carry the single hostname meet.know-me.tools; a route for any other
# host cannot attach. A future tenant adds its own listener here by pull request.
# Consequence: the ClusterIssuers' opt-in HTTP-01 solver (which routes through this Gateway)
# only works for meet.know-me.tools until such a listener exists. This repo uses DNS-01.
#
# ROUTES: only HTTPRoutes from the know-meet namespace may attach. The routes live next to
# their backend Services, so no ReferenceGrant is needed (a route to a Service in its own
# namespace needs none, and attaching to a Gateway in another namespace is governed by
# allowedRoutes). The listener's certificateRef is a Secret in the Gateway's own namespace,
# which also needs no ReferenceGrant.
#
# Prune=false and Delete=false: the Gateway is shared and owns the public address. Removing
# this file, or deleting the Application, must not take the address away.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  gatewayClassName: eg
  listeners:
    - name: https-meet
      protocol: HTTPS
      port: 443
      hostname: meet.know-me.tools
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: meet-know-me-tools-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: know-meet
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
    - name: http-meet
      protocol: HTTP
      port: 80
      hostname: meet.know-me.tools
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: know-meet
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
